  const h = m.health==='healthy'?'':m.health;
  return '<span class="model-badge '+(cls||'')+'" title="'+esc((m.provider?m.provider+'/':'')+m.name+' · 来源 '+m.source)+'"><span class="src '+src+'">'+esc(m.source)+'</span><i class="h '+h+'"></i><span class="nm">'+esc(m.name)+'</span></span>';
}
function gateDots(gates){
  return '<span class="gate-dots" aria-label="门禁摘要">'+gates.map((g,i)=>'<i class="'+g+'" title="C'+(i+1)+' '+GATE_LABEL[g]+'"></i>').join('')+'</span>';
}
function gateLadder(gates, opts){
  const o = opts||{};
  const items = gates.map((g,i)=>{
    const d = GATE_DEFS[i];
    const mark = g==='pass'?'✓':g==='fail'?'✕':g==='blocked'?'!':'';
    const attrs = o.click ? ' data-action="gate-jump" data-g="'+i+'" role="button" tabindex="0"' : '';
    return '<div class="gate '+g+'"'+attrs+' aria-label="'+d.id+' '+d.name+' '+GATE_LABEL[g]+'">'
      +'<span class="gate-sq">'+mark+'</span>'
      +'<span class="gate-lb">'+d.id+'</span>'
      +(o.labels===false?'':'<span class="gate-st">'+d.name+'</span>')
      +'</div>';
  }).join('');
  return '<div class="gate-ladder">'+items+'</div>';
}
function aggregateGates(){
  const counts = GATE_DEFS.map((d,i)=>{
    const total = TASKS.filter(t=>t.gates[i]!=='na').length;
    const pass = TASKS.filter(t=>t.gates[i]==='pass').length;
    return {pass,total};
  });
  const items = counts.map((c,i)=>{
    const tone = c.pass===c.total ? 'pass' : (c.total-c.pass>2 ? 'fail' : 'pending');
    return '<div class="gate '+tone+'" aria-label="'+GATE_DEFS[i].id+' '+c.pass+'/'+c.total+'"><span class="gate-sq">'+c.pass+'</span><span class="gate-lb">'+GATE_DEFS[i].id+'</span><span class="gate-st">'+c.pass+'/'+c.total+'</span></div>';
  }).join('');
  return '<div class="gate-ladder">'+items+'</div>';
}
function stageBar(progress, stateKey, opts){
  const o = opts||{};
  const stages = ['受理','检索','计划','审批','预检','执行','归档'];
  const current = Math.max(0, Math.min(6, Math.round((progress/100)*6)));
  const tone = stateKey==='failed'?'bad':stateKey==='blocked'?'amber':stateKey==='passed'?'ok':'';
  return '<div class="chartbar '+(o.static?'static':'')+'">'
    +'<div class="track"><i class="fill '+tone+'" style="width:'+Math.max(2,progress)+'%"></i></div>'
    +'<div class="scale">'+stages.map((s,i)=>'<span class="'+(i<current?'done':i===current?'on':'')+'">'+s+'</span>').join('')+'</div>'
    +'</div>';
}

/* ---------------------------------------------------------------- routing */
function parseHash(){
  const raw = decodeURIComponent((location.hash||'').replace(/^#\/?/,''));
  if(!raw) return {page:'overview'};
  const p = raw.split('/').filter(Boolean);
  if(p[0]==='tasks' && p[1]) return {page:'task',id:p[1],tab:p[2]||'summary'};
  if(p[0]==='knowledge' && p[1]) return {page:'kb',id:p[1]};
  if(p[0]==='nodes' && p[1]) return {page:'node',id:p[1]};
  if(p[0]==='takeover') return {page:'takeover',id:p[1]||'ait-20261026-0412'};
  return {page:p[0]||'overview'};
}
function go(hash){
  document.body.classList.remove('drawer-open');
  if(location.hash===hash){ render(); }
  else location.hash = hash;
}

function render(){
  const r = parseHash();
  state.route = r;
  document.body.classList.toggle('takeover-mode', r.page==='takeover');
  const view = document.getElementById('view');
  let html='';
  switch(r.page){
    case 'overview': html=pageOverview(); break;
    case 'tasks': html=pageTasks(); break;
    case 'task': html=pageTask(r.id,r.tab); break;
    case 'think': html=pageThink(); break;
    case 'knowledge': html=pageKnowledge(); break;
    case 'kb': html=pageKb(r.id); break;
    case 'nodes': html=pageNodes(); break;
    case 'node': html=pageNode(r.id); break;
    case 'models': html=pageModels(); break;
    case 'toolchain': html=pageToolchain(); break;
    case 'push': html=pagePush(); break;
    case 'agents': html=pageAgents(); break;
    case 'roundtable': html=pageRoundtable(); break;
    case 'takeover': html=pageTakeover(r.id); break;
    case 'system': html=pageSystem(); break;
    default: html='<div class="empty">页面不存在</div>';
  }
  view.innerHTML = html;
  fillIcons(view);

}

function gateNote(t){
  if(t.state==='waiting') return 'C2 等待真实执行';
  if(t.state==='running') return 'C5 证据采集中';
  if(t.state==='blocked') return 'C4 结论分歧未解决';
  if(t.state==='failed') return '门禁 7/7，结论由 firmware 根因判定';
  if(t.state==='passed') return '门禁 7/7，已归档';
  if(t.state==='stopped') return 'C2 至 C6 不适用，C7 已保留';
  return 'C1 计划待生成';
}

/* ---- tab: summary */
function judgementFor(t){
  if(t.state==='waiting') return {tone:'amber',title:'建议先确认失败窗口，再批准计划。',text:'相似任务 kb-1011 与 kb-1088 在窗口定义上存在争议；不确认会把 C5 的判定口径留给执行阶段。'};
  if(t.state==='planning') return {tone:'brand',title:'计划草案仍在生成。',text:'检索包已注入 5 条历史；assurance 通过后才能提交审批。'};
  if(t.state==='preflight') return {tone:'brand',title:'计划已批准，等待预检 10/20 次。',text:'预检只证明脚本能执行，不是完成证据；未通过不得进入正式执行。'};
  if(t.state==='running') return {tone:'brand',title:'执行中，C5 证据正在采集。',text:'当前阶段 '+t.progress+'%；不要用部分证据或 runner 自报判断通过。'};
  if(t.state==='blocked') return {tone:'bad',title:'C4 结论分歧，需要人工裁决。',text:'runner 与复算不一致；PASS 被阻断，人工只能附加结论，不能覆盖机器结论。'};
  if(t.state==='failed') return {tone:'bad',title:'结论不通过，根因 firmware。',text:'门禁 7/7 只证明流程完整，不证明产品通过；请查看根因与证据。'};
  if(t.state==='passed') return {tone:'ok',title:'已通过并归档。',text:'C1 至 C7 全过，playbook 已创建；可导出交付或查看知识。'};
  if(t.state==='stopped') return {tone:'amber',title:'已停止，保留了证据。',text:'停止不产生产品结论；C7 可复现清单仍保留。'};
  return {tone:'brand',title:'等待计划生成。',text:'需求关键字段仍待确认；平台不会用旧项目默认值猜测。'};
}

    ['R1 唤醒成功率','TC-01, TC-02','log_seq / threshold','✓'],
    ['R2 误唤醒','TC-03, TC-04','threshold','✓'],

/* ---- tab: cases */
function tabCases(t){
  const cases = [
    ['TC-01','单次唤醒成功','R1','log_sequence','串口 ≥ 80 行','3'],
    ['TC-02','200 次成功率','R1','threshold','串口 + csv','0'],
    ['TC-03','误唤醒（静音 30 分钟）','R2','threshold','串口 + 音频','0'],
    ['TC-04','误唤醒（噪声 45dB）','R2','threshold','串口 + 音频','2'],
    ['TC-05','P95 尾延迟','R3','timing_window','串口 + csv','0'],
    ['TC-06','冷/热启动分组','R4','state_transition','串口 + 截图','1']
  ];
  const st = t.state;
  const statusFor = i => {
    if(st==='passed') return '通过';
    if(st==='failed') return i===3?'失败':'通过';
    if(st==='running') return i<3?'通过':i===3?'执行中':'未执行';
    if(st==='blocked') return i<2?'通过':i===2?'阻塞':'未执行';
    if(st==='stopped') return i<2?'已停止':'未执行';
    return '未执行';
  };
  const tone = s => s==='通过'?'ok':s==='失败'?'danger':s==='阻塞'||s==='执行中'?'amber':'neutral';
  return card('用例', '<div class="row wrap" style="margin-bottom:12px"><span class="chip active">全部 6</span><span class="chip">通过</span><span class="chip">失败</span><span class="chip">阻塞</span><span class="chip">未执行</span><span class="faint" style="margin-left:auto">oracle 类型：6 种</span></div>'
    +'<div class="table-wrap" style="border:0"><table class="data" style="min-width:700px"><thead><tr><th>用例</th><th>标题</th><th>需求</th><th>Oracle</th><th>证据要求</th><th>重试</th><th>状态</th></tr></thead><tbody>'
    +cases.map((c,i)=>'<tr><td class="mono" style="font-size:11px;color:var(--na-brand-text)">'+c[0]+'</td><td><div class="cell-title" style="font-size:12px">'+esc(c[1])+'</div></td><td class="mono" style="font-size:10px">'+c[2]+'</td><td><span class="badge neutral tiny square">'+c[3]+'</span></td><td style="font-size:11px">'+esc(c[4])+'</td><td class="num">'+c[5]+'</td><td><span class="badge '+tone(statusFor(i))+' tiny">'+statusFor(i)+'</span></td></tr>').join('')
    +'</tbody></table></div>', {sub:'计划批准后生成；用例不可跳过证据要求', actions:'<button class="link" data-action="export-toast">导出用例</button>'})
    +'<div class="grid grid-2"><div class="card compact"><div class="card-h"><div class="card-title">TC-03 展开</div><span class="badge neutral tiny square">threshold</span></div><div class="kv" style="grid-template-columns:80px 1fr"><dt>前置</dt><dd>静音房 · 30 分钟 · 设备不重启</dd><dt>动作</dt><dd>持续采集，不播放唤醒词</dd><dt>期望</dt><dd>误唤醒 0 次；任何唤醒都记录音频与串口</dd><dt>禁止</dt><dd>不得用耳机回环替代环境噪声</dd><dt>证据窗口</dt><dd>开始前 5s 至结束后 5s</dd></div></div>'
      +'<div class="card compact"><div class="card-h"><div class="card-title">证据要求</div><span class="badge amber tiny">1 项缺失</span></div><div class="list"><div class="list-row"><div class="lr-main"><div class="lr-t">串口日志 ≥ 80 行 + WAKE_FAIL 标记</div><div class="lr-s">缺失：TC-03</div></div><span class="badge amber tiny">缺失</span></div><div class="list-row"><div class="lr-main"><div class="lr-t">音频文件 + SHA-256</div><div class="lr-s">已配置</div></div><span class="badge ok tiny">就绪</span></div></div><div class="row" style="margin-top:10px"><button class="btn sm" data-action="evidence-toast">查看证据</button></div></div></div>';
}

/* ---- tab: verdict */
function tabVerdict(t){
  const isPass = t.state==='passed', isFail = t.state==='failed', isBlocked = t.state==='blocked';
  const label = isPass?'通过':isFail?'不通过':isBlocked?'人工阻塞':'未出结论';
  const tone = isPass?'ok':isFail?'danger':isBlocked?'amber':'neutral';
  return '<div class="card"><div class="row-between wrap" style="align-items:flex-start"><div><div class="eyebrow">VERDICT · 结论</div><div class="row" style="margin-top:8px;gap:10px"><span class="badge '+tone+'" style="font-size:14px;padding:6px 12px">'+icon(isPass?'check':isFail?'x':isBlocked?'alert':'clock')+label+'</span><span class="faint">机器结论与人工结论分开记录</span></div></div><button class="btn sm" data-action="export-toast">'+icon('download')+'导出结论</button></div>'
    +'<div class="hr"></div><div class="grid grid-4">'
      +[['功能',isPass||isFail?'通过':'待评估',isPass||isFail?'ok':'neutral'],['稳定性',isPass?'通过':isFail?'不通过':'待评估',isPass?'ok':isFail?'danger':'neutral'],['性能',isPass?'通过':isFail?'不通过':'待评估',isPass?'ok':isFail?'danger':'neutral'],['证据充分性',isPass||isFail?'通过':'不足',isPass||isFail?'ok':'amber']].map(d=>'<div><div class="faint">'+d[0]+'</div><div style="margin-top:6px"><span class="badge '+d[2]+' tiny">'+d[1]+'</span></div></div>').join('')
    +'</div></div>'

function kbStatus(s){
  const map = {approved:['已批准','ok'],corroborated:['已佐证','brand'],candidate:['候选','neutral'],disputed:['有争议','disputed'],stale:['已陈旧','stale'],retracted:['已撤回','neutral']};

  return '<span class="badge '+v[1]+' tiny"><i class="dot"></i>'+v[0]+'</span>';
}

let lastFocus = null;
function openModal(html, opts){
  const o = opts||{};
  lastFocus = document.activeElement;
  const host = document.getElementById('overlayHost');
  host.innerHTML = '<div class="overlay '+(o.drawer?'drawer':'')+'" data-action="overlay-close"><div class="modal" role="dialog" aria-modal="true" aria-label="'+(o.label||'对话框')+'">'+html+'</div></div>';
  const modal = host.querySelector('.modal');
  const focusable = modal.querySelector('input,select,textarea,button:not([disabled])');
  if(focusable) setTimeout(()=>focusable.focus(), 30);
}
function closeModal(){
  document.getElementById('overlayHost').innerHTML='';
  if(lastFocus && lastFocus.focus) lastFocus.focus();
  lastFocus=null;
}
function modalHead(title, sub){
  return '<div class="modal-h"><div><h3>'+title+'</h3>'+(sub?'<div class="m-sub">'+sub+'</div>':'')+'</div><button class="icon-btn" data-action="close-modal" aria-label="关闭">'+icon('x')+'</button></div>';
}
function modalFoot(okLabel, action, attrs, danger){
  return '<div class="modal-f"><button class="btn" data-action="close-modal">取消</button><button class="btn '+(danger?'danger':'primary')+'" data-action="'+action+'" '+(attrs||'')+'>'+okLabel+'</button></div>';
}
function toast(msg, opt){
  const o = opt||{};
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast '+(o.tone||'');
  el.setAttribute('role', o.tone==='bad'?'alert':'status');
  el.innerHTML = '<span class="ti">'+icon(o.icon||(o.tone==='bad'?'alert':o.tone==='amber'?'alert':'check'))+'</span><div>'+msg+'</div>';
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),180); }, o.duration||3200);
}
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); }
    else{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('已复制：'+esc(cut(text,48)));
  }catch(e){ toast('复制失败，请手动选择文本',{tone:'bad'}); }
}

let palIdx=0;
function paletteItems(q){
  const s=(q||'').trim().toLowerCase();
  return PALETTE.filter(x=>!s || x.label.toLowerCase().includes(s) || x.kind.toLowerCase().includes(s)).slice(0,12);
}
function openPalette(){
  const host=document.getElementById('paletteHost');
  host.innerHTML='<div class="palette-overlay" data-action="close-palette"><div class="palette" role="dialog" aria-modal="true" aria-label="命令面板"><div class="palette-in">'+icon('search')+'<input id="paletteInput" type="text" placeholder="搜索页面、任务、知识，或输入 > 执行命令" aria-label="命令面板搜索"><span class="kbd">Esc</span></div><div class="palette-list" id="palRows"></div></div></div>';
  const input=document.getElementById('paletteInput');
  input.addEventListener('input',()=>{palIdx=0;renderPalette(input.value);});
  input.addEventListener('keydown',e=>{
    const items=paletteItems(input.value);
    if(e.key==='ArrowDown'){ e.preventDefault(); palIdx=Math.min(items.length-1,palIdx+1); renderPalette(input.value); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); palIdx=Math.max(0,palIdx-1); renderPalette(input.value); }
    else if(e.key==='Enter'){ e.preventDefault(); const it=items[palIdx]; if(it) paletteGo(it); }
    else if(e.key==='Escape'){ closePalette(); }
  });
  renderPalette('');
  setTimeout(()=>input.focus(),30);
}
function renderPalette(q){
  const items=paletteItems(q);
  const rows=document.getElementById('palRows'); if(!rows) return;
  if(!items.length){ rows.innerHTML='<div class="pal-empty">没有匹配结果。试试“任务”“知识”或“接管”。</div>'; return; }
  if(palIdx>=items.length) palIdx=items.length-1;
  rows.innerHTML=items.map((x,i)=>'<button class="pal-item '+(i===palIdx?'sel':'')+'" data-action="palette-go" data-hash="'+esc(x.hash||'')+'" data-cmd="'+esc(x.cmd||'')+'"><span class="pi">'+icon(x.icon)+'</span><span>'+esc(x.label)+'</span><span class="pk">'+esc(x.kind)+'</span></button>').join('');
}
function closePalette(){ document.getElementById('paletteHost').innerHTML=''; }
function paletteGo(it){
  closePalette();
  if(it.cmd==='model'){ openModelSwitch('global'); return; }
  if(it.cmd==='smoke'){ go('#/toolchain'); setTimeout(runSmoke,120); return; }
  if(it.hash) go(it.hash);
}

/* ---------------------------------------------------------------- event handling */
document.addEventListener('click', function(e){
  const nav = e.target.closest('[data-nav]');
  if(nav){
    e.preventDefault();
    const page=nav.dataset.nav;
    const id=nav.dataset.id;
    if(page==='takeover'){ go('#/takeover/'+(id||'ait-20261026-0412')); }
    else if(page==='node' && id){ go('#/nodes/'+id); }
    else go('#/'+page);
    return;
  }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='overlay-close'){
    if(e.target===el) closeModal();
    return;
  }
  if(action==='close-palette'){
    if(e.target===el || e.target.closest('.palette')===null) closePalette();
    return;
  }
  switch(action){
    case 'sys-scroll': e.preventDefault(); { var target=document.getElementById(el.dataset.target); if(target) target.scrollIntoView({behavior:'smooth',block:'start'}); } break;
    case 'open-drawer': document.body.classList.add('drawer-open'); break;
    case 'close-drawer': document.body.classList.remove('drawer-open'); break;
    case 'open-palette': openPalette(); break;
    case 'close-modal': closeModal(); break;
    case 'open-task': closeModal(); go('#/tasks/'+el.dataset.id+'/summary'); break;
    case 'task-tab': go('#/tasks/'+el.dataset.id+'/'+el.dataset.tab); break;
    case 'gate-jump': {
      const r=state.route;
      if(r.page==='task'){ go('#/tasks/'+r.id+'/gates'); }
      break;
    }
    case 'task-menu': openTaskMenu(el.dataset.id); break;
    case 'approve-task': openApprove(el.dataset.id); break;
    case 'confirm-approve': confirmApprove(el.dataset.id); break;
    case 'request-change': requestChange(el.dataset.id); break;
    case 'confirm-change': closeModal(); render(); toast('已提交修改请求。原型未调用后端；真实系统会创建新的计划修订。',{tone:'amber'}); break;
    case 'resolve-modal': openConflict(el.dataset.id); break;
    case 'open-similar': closeModal(); go('#/tasks/'+el.dataset.id+'/similar'); break;
    case 'open-kb': go('#/knowledge/'+el.dataset.id); break;
    case 'clear-task-filter': state.taskQ=''; state.taskState='all'; state.taskProject='all'; state.taskMine=false; render(); break;
    case 'filter-mine': state.taskMine=!state.taskMine; render(); break;
    case 'kb-status': state.kbStatus=el.dataset.status; render(); break;
    case 'clear-kb-filter': state.kbQ=''; state.kbStatus='all'; render(); break;
    case 'model-scope': state.modelScope=el.dataset.scope; render(); break;
    case 'open-model-switch': openModelSwitch(el.dataset.scope, el.dataset.target); break;
    case 'confirm-model-switch': confirmModelSwitch(el.dataset.scope, el.dataset.target); break;
    case 'toggle-sub': {
      const s=state.pushSubs.find(x=>x.id===el.dataset.id); if(s){ s.enabled=!s.enabled; el.setAttribute('aria-pressed',String(s.enabled)); toast(s.name+' 已'+(s.enabled?'启用':'禁用'),{tone:s.enabled?'ok':'amber'}); }
      break;
    }
    case 'new-sub': openNewSub(); break;
    case 'confirm-new-sub': {
      const n=document.getElementById('subName'); const ch=document.getElementById('subChannel');
      state.pushSubs.unshift({id:'sub-0'+(state.pushSubs.length+1),name:(n?n.value:'新订阅'),channel:(ch?ch.value:'webhook'),events:'task.completed, task.blocked',level:'warning',filter:'全部',enabled:true,last:'尚未投递'});
      closeModal(); render(); toast('订阅已创建。原型未调用后端。',{tone:'ok'});

function filteredKbCount(){
  const q=state.kbQ.trim().toLowerCase();
  return DATA.knowledge.filter(k=>(state.kbStatus==='all'||k.status===state.kbStatus)&&(!q||(k.title+' '+k.summary+' '+k.kind+' '+k.app).toLowerCase().includes(q))).length;
}
function updateTaskRows(){
  const rows=document.getElementById('taskRows'); if(rows) rows.innerHTML=taskRowsHTML();
  const c=document.getElementById('taskCount'); if(c) c.textContent=filteredTasks().length+' 条';
  const f=document.getElementById('taskFoot'); if(f) f.textContent='显示 '+filteredTasks().length+' / 共 128 条';
  fillIcons(document);
}
function toggleLive(){
  const chip=document.getElementById('liveChip'); const txt=document.getElementById('liveText'); const conn=document.getElementById('railConn');
  if(!chip) return;
  if(state.live==='live'){ state.live='degraded'; chip.className='live-chip degraded'; txt.textContent='降级轮询 5s'; chip.firstElementChild.className='dot'; if(conn) conn.innerHTML='<span class="dot" style="color:var(--na-warn)"></span><b>降级轮询</b><span>5s</span>'; toast('SSE 已断开，降级为每 5 秒轮询；数据可能滞后。',{tone:'amber'}); }
  else if(state.live==='degraded'){ state.live='offline'; chip.className='live-chip offline'; txt.textContent='离线'; chip.firstElementChild.className='dot'; if(conn) conn.innerHTML='<span class="dot" style="color:var(--na-danger)"></span><b>离线</b><span>写操作禁用</span>'; toast('离线：写操作已禁用，当前表单保留。',{tone:'bad'}); }
  else { state.live='live'; chip.className='live-chip'; txt.textContent='实时'; chip.firstElementChild.className='dot live-dot'; if(conn) conn.innerHTML='<span class="dot live-dot" style="color:var(--na-ok)"></span><b>实时</b><span>seq 12,345</span>'; toast('已恢复实时。',{tone:'ok'}); }
}
function scrollTerm(){ setTimeout(()=>{ const el=document.querySelector('.tk-term .terminal'); if(el) el.scrollTop=el.scrollHeight; },20); }
function runSmoke(){
  if(state.smoke.running) return;
  if(state.route.page!=='toolchain') go('#/toolchain');
  state.smoke.running=true; state.smoke.pct=8;
  clearInterval(window.__smoke);
  window.__smoke=setInterval(()=>{
    state.smoke.pct=Math.min(100,state.smoke.pct+12);
    if(state.smoke.pct>=100){
      clearInterval(window.__smoke); state.smoke.running=false; state.smoke.last='刚刚'; state.smoke.result='通过';
      DATA.toolchain[0].smoke='通过 刚刚';
      if(state.route.page==='toolchain') render();
      toast('tier-1 冒烟通过（mock）。漂移仍需人工确认或回滚。',{tone:'ok'});
    }else{
      if(state.route.page==='toolchain') render();
    }
  },240);
}
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); }
  if(e.key==='Escape'){ closeModal(); closePalette(); document.body.classList.remove('drawer-open'); }
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('gate')){ e.target.click(); }
  if((e.key==='ArrowRight'||e.key==='ArrowLeft') && e.target.classList && e.target.classList.contains('tab')){
    const tabs=Array.from(document.querySelectorAll('.tab'));
    const i=tabs.indexOf(e.target);
    if(i>=0){
      e.preventDefault();
      const j=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
      const key=tabs[j].dataset.tab;
      tabs[j].click();
      setTimeout(()=>{ var el=document.querySelector('.tab[data-tab="'+key+'"]'); if(el) el.focus(); },60);
    }
  }
  if((e.key==='ArrowRight'||e.key==='ArrowLeft') && e.target.classList && e.target.classList.contains('gate')){
    const gates=Array.from(e.target.parentElement.querySelectorAll('.gate'));
    const i=gates.indexOf(e.target);
    if(i>=0){ e.preventDefault(); const j=(i+(e.key==='ArrowRight'?1:-1)+gates.length)%gates.length; gates[j].focus(); }
  }
});

/* init */
function boost(){
  fillIcons(document);
  render();
  setInterval(updateTkCountdown, 1000);
}
window.addEventListener('hashchange', render);
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boost); else boost();
</script>
