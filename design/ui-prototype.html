<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>NoahsArk Console · 航次档案 · UI Prototype (MOCK DATA)</title>
<style>
/* ==========================================================================
   NoahsArk Console · Voyage Ledger · design prototype
   DESIGN PROTOTYPE ONLY. All data is mock. No network, no backend.
   Tokens mirror design/design-tokens.json.
   ========================================================================== */
:root{
  color-scheme:light;

  /* paper scale */
  --na-canvas:#F4F0E6;
  --na-canvas-deep:#E4DDCE;
  --na-panel:#F8F5EC;
  --na-card:#FCFAF4;
  --na-card-hover:#FFFDF8;
  --na-sunken:#EAE4D6;
  --na-raised:#FFFDF8;
  --na-line:#D6D0C2;

  --na-border-hairline:rgba(27,42,46,.12);
  --na-border:rgba(27,42,46,.20);
  --na-border-strong:rgba(27,42,46,.38);

  --na-text:#1B2A2E;
  --na-text-2:#43585B;
  --na-text-3:#5E7072;
  --na-text-disabled:#98A5A3;
  --na-link:#1F5F5B;

  --na-brand:#1F5F5B;
  --na-brand-text:#1F5F5B;
  --na-brand-600:#174C49;
  --na-brand-700:#103A38;
  --na-brand-soft:rgba(31,95,91,.10);
  --na-brand-wash:rgba(31,95,91,.045);

  --na-signal:#B8482C;
  --na-signal-ink:#8E3320;
  --na-signal-soft:rgba(184,72,44,.10);

  --na-evidence:#2C7A6B;
  --na-evidence-ink:#1F6257;
  --na-evidence-soft:rgba(44,122,107,.10);

  --na-ok:#2E6B45;
  --na-ok-ink:#275C3B;
  --na-ok-soft:rgba(46,107,69,.10);
  --na-warn:#8F5A18;
  --na-warn-ink:#7A4B12;
  --na-warn-soft:rgba(143,90,24,.10);
  --na-danger:#A33A34;
  --na-danger-ink:#8C2F2A;
  --na-danger-soft:rgba(163,58,52,.10);
  --na-info:#2A6480;
  --na-info-ink:#245772;
  --na-info-soft:rgba(42,100,128,.10);
  --na-stale:#647372;
  --na-disputed:#A2551A;

  --na-terminal:#12211F;
  --na-terminal-raised:#182A28;
  --na-terminal-text:#E7E3D6;
  --na-terminal-dim:#8FA39D;
  --na-terminal-line:rgba(231,227,214,.14);

  --na-font-sans:"Aptos","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --na-font-display:"Sitka Banner","Palatino Linotype","Songti SC","Source Han Serif SC","SimSun",serif;
  --na-font-mono:"Cascadia Mono","Cascadia Code",Consolas,"Courier New",monospace;

  --na-r-sm:2px; --na-r-md:3px; --na-r-lg:4px; --na-r-xl:4px; --na-r-2xl:10px;
  --na-shadow-card:0 1px 0 rgba(27,42,46,.03),2px 2px 0 rgba(27,42,46,.055);
  --na-shadow-raised:0 2px 0 rgba(27,42,46,.04),4px 6px 0 rgba(27,42,46,.07);
  --na-shadow-pop:0 0 0 1px rgba(27,42,46,.14),0 18px 40px rgba(27,42,46,.16);
  --na-shadow-modal:0 0 0 1px rgba(27,42,46,.16),0 30px 80px rgba(27,42,46,.22);
  --na-focus:#1F5F5B;

  /* canonical semantic aliases (JSON paths flattened) */
  --na-paper-canvas:var(--na-canvas);
  --na-paper-panel:var(--na-panel);
  --na-paper-card:var(--na-card);
  --na-paper-card-hover:var(--na-card-hover);
  --na-paper-sunken:var(--na-sunken);
  --na-paper-track:var(--na-line);
  --na-text-primary:var(--na-text);
  --na-text-secondary:var(--na-text-2);
  --na-text-tertiary:var(--na-text-3);
  --na-brand-500:var(--na-brand);
  --na-signal-500:var(--na-signal);
  --na-evidence-500:var(--na-evidence);

  --ribbon:26px;
  --deck:90px;
  --deck-top:52px;
  --deck-nav:38px;
  --pad:36px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--na-font-sans);
  font-size:13px;
  line-height:1.55;
  color:var(--na-text);
  background:
    radial-gradient(1200px 420px at 18% -8%,rgba(31,95,91,.10),transparent 62%),
    repeating-linear-gradient(180deg,rgba(27,42,46,0.034) 0 1px,transparent 1px 64px),
    var(--na-canvas);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--na-link);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
table{border-collapse:collapse;width:100%}
svg{display:block;width:16px;height:16px;flex:none}
.badge svg{width:12px;height:12px}
.copy-inline svg{width:11px;height:11px}
.link svg{width:13px;height:13px;display:inline-block;vertical-align:-2px}
.callout .ci svg,.validate .vi svg{width:14px;height:14px}
.toast .ti svg{width:14px;height:14px}
.rt-item .ri svg{width:13px;height:13px;margin-top:2px}
svg{display:block}
::selection{background:rgba(31,95,91,.28)}
:focus-visible{outline:2px solid var(--na-focus);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C9C2B3;border-radius:999px;border:2px solid var(--na-canvas)}
::-webkit-scrollbar-thumb:hover{background:#B7B0A2}

/* utilities */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;left:12px;top:-60px;z-index:900;background:var(--na-brand-600);color:#fff;padding:8px 14px;border-radius:6px;transition:top .15s}
.skip:focus{top:36px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mono{font-family:var(--na-font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--na-text-3)}
.muted-2{color:var(--na-text-2)}
.faint{color:var(--na-text-3);font-size:11px}
.tnum{font-variant-numeric:tabular-nums}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--na-border);border:0;margin:16px 0}
.eyebrow{
  font-family:var(--na-font-mono);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--na-text-3);
}
.eyebrow.brand{color:var(--na-brand-text)}
.eyebrow.amber{color:var(--na-signal-ink)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.dot.lg{width:8px;height:8px}
.live-dot{position:relative}
.live-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid currentColor;opacity:.25;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.28}50%{transform:scale(1.35);opacity:.05}}

/* prototype ribbon */
.proto-banner{
  height:28px;display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--na-font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--na-signal-ink);
  background:
    repeating-linear-gradient(135deg,rgba(184,72,44,.08) 0 6px,rgba(184,72,44,.02) 6px 12px),
    #12211F;
  border-bottom:1px solid rgba(184,72,44,.22);
  position:relative;z-index:600;
}
.proto-banner b{font-weight:600;color:#FCFAF4}
.proto-banner span{color:var(--na-text-3);letter-spacing:.08em}

/* app shell */
.app{
  display:grid;grid-template-columns:var(--rail) minmax(0,1fr);
  height:calc(100dvh - 28px);min-height:0;
}
.rail{
  background:linear-gradient(180deg,rgba(248,245,236,.96),rgba(248,245,236,.98));
  border-right:1px solid var(--na-border);
  display:flex;flex-direction:column;min-height:0;position:relative;z-index:200;
}
.rail-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--na-border-hairline)}
.rail-brand .ark{width:30px;height:30px;color:var(--na-text);flex:none}
.rail-brand .wordmark{font-family:var(--na-font-display);font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.rail-brand .wordmark em{font-style:normal;color:var(--na-brand-text)}
.rail-brand .tag{font-family:var(--na-font-mono);font-size:8px;letter-spacing:.16em;color:var(--na-text-3);margin-top:3px}
.rail-scroll{flex:1;min-height:0;overflow:auto;padding:10px 10px 16px}
.nav-group{margin-top:12px}
.nav-group:first-child{margin-top:2px}
.nav-label{font-family:var(--na-font-mono);font-size:10px;letter-spacing:.14em;color:var(--na-text-3);text-transform:uppercase;padding:8px 10px 6px}
.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;
  color:var(--na-text-2);font-size:12.5px;text-align:left;position:relative;
  transition:background-color .12s,color .12s;
}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.8}
.nav-item:hover{background:rgba(27,42,46,0.067);color:var(--na-text);text-decoration:none}
.nav-item[aria-current="page"]{background:var(--na-brand-soft);color:var(--na-text);font-weight:600}
.nav-item[aria-current="page"]::before{display:none}
.nav-item[aria-current="page"] svg{opacity:1;color:var(--na-brand-text)}
.nav-item .nav-count{margin-left:auto;font-family:var(--na-font-mono);font-size:10px;color:var(--na-signal-ink);background:var(--na-signal-soft);border-radius:999px;padding:1px 6px}
.rail-foot{border-top:1px solid var(--na-border);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.conn{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--na-text-3)}
.conn b{font-weight:500;color:var(--na-text-2)}
.user{display:flex;align-items:center;gap:9px}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#1F5F5B,#103A38);display:grid;place-items:center;font-size:10px;font-weight:600;color:#FCFAF4;flex:none;border:1px solid rgba(27,42,46,0.152)}
.user .u-name{font-size:12px;line-height:1.2}
.user .u-role{font-size:10px;color:var(--na-text-3)}

/* main shell */
.shell{display:grid;grid-template-rows:var(--topbar) minmax(0,1fr);min-width:0;height:100%;min-height:0}
.topbar{
  height:var(--topbar);display:flex;align-items:center;gap:14px;padding:0 var(--pad);
  border-bottom:1px solid var(--na-border);
  background:rgba(248,245,236,.86);backdrop-filter:blur(10px);
  position:relative;z-index:210;min-width:0;
}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--na-text-3);min-width:0}
.crumbs b{font-weight:500;color:var(--na-text-2)}
.crumbs .sep{opacity:.45}
.crumbs .now{color:var(--na-text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-search{
  margin-left:auto;display:flex;align-items:center;gap:8px;min-width:220px;max-width:340px;flex:1;
  height:32px;padding:0 10px;border:1px solid var(--na-border);border-radius:6px;
  background:var(--na-card);color:var(--na-text-3);font-size:12px;text-align:left;
  transition:border-color .12s,background-color .12s;
}
.top-search:hover{border-color:var(--na-border-strong);background:var(--na-card-hover)}
.top-search svg{width:15px;height:15px;flex:none}
.top-search .kbd{margin-left:auto;font-family:var(--na-font-mono);font-size:10px;border:1px solid var(--na-border);border-radius:4px;padding:1px 5px;color:var(--na-text-3)}
.live-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--na-ok-ink);border:1px solid rgba(46,107,69,.22);background:var(--na-ok-soft);border-radius:999px;padding:4px 9px;white-space:nowrap}
.live-chip.degraded{color:var(--na-warn-ink);border-color:rgba(143,90,24,.26);background:var(--na-warn-soft)}
.live-chip.offline{color:var(--na-danger-ink);border-color:rgba(163,58,52,.26);background:var(--na-danger-soft)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--na-text-2);border:1px solid transparent;flex:none}
.icon-btn:hover{background:rgba(27,42,46,0.095);color:var(--na-text)}
.icon-btn svg{width:17px;height:17px}
.menu-btn{display:none}
.main{min-height:0;overflow:auto;padding:24px var(--pad) 48px;position:relative}
.page{max-width:1480px;margin:0 auto;animation:pageIn .18s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}

/* page header */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px}
.page-head .ph-main{min-width:0}
.page-head h1{font-family:var(--na-font-display);font-size:24px;line-height:1.25;letter-spacing:-.02em;font-weight:600;margin-top:6px}
.page-head .sub{color:var(--na-text-3);font-size:12.5px;margin-top:6px;max-width:78ch}
.page-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.hero-title{font-family:var(--na-font-display);font-size:32px;line-height:1.2;letter-spacing:-.025em;font-weight:600;max-width:20ch}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--na-border);
  background:rgba(27,42,46,0.038);color:var(--na-text-2);font-size:12px;font-weight:500;
  white-space:nowrap;transition:background-color .12s,border-color .12s,color .12s;
}
.btn svg{width:15px;height:15px}
.btn:hover{background:rgba(27,42,46,0.104);border-color:var(--na-border-strong);color:var(--na-text);text-decoration:none}
.btn:active{background:rgba(27,42,46,0.038)}
.btn.primary{background:var(--na-brand-600);border-color:var(--na-brand-600);color:#fff}
.btn.primary:hover{background:#174C49;border-color:#174C49}
.btn.ghost{background:transparent;border-color:transparent;color:var(--na-text-2)}
.btn.ghost:hover{background:rgba(27,42,46,0.095);border-color:transparent;color:var(--na-text)}
.btn.amber{background:var(--na-signal);border-color:var(--na-signal);color:#FCFAF4;font-weight:600}
.btn.amber:hover{background:#9A3822;border-color:#9A3822}
.btn.danger{border-color:rgba(163,58,52,.4);color:var(--na-danger-ink);background:rgba(163,58,52,.06)}
.btn.danger:hover{background:var(--na-danger-soft);border-color:rgba(163,58,52,.6)}
.btn.sm{height:28px;padding:0 9px;font-size:11px}
.btn.xs{height:24px;padding:0 7px;font-size:10.5px;border-radius:4px}
.btn.icon{padding:0;width:32px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.42;cursor:not-allowed;pointer-events:none}
.link{color:var(--na-link);font-size:12px;background:none;padding:0;border:0}
.link:hover{text-decoration:underline}
.link.amber{color:var(--na-signal-ink)}
.kbd{font-family:var(--na-font-mono);font-size:10px;border:1px solid var(--na-border);border-radius:4px;padding:1px 5px;color:var(--na-text-3)}

/* cards */
.card{
  background:linear-gradient(180deg,rgba(27,42,46,0.046),rgba(27,42,46,0) 60%),var(--na-card);
  border:1px solid var(--na-border);border-radius:var(--na-r-xl);
  box-shadow:var(--na-shadow-card);padding:20px;min-width:0;
}
.card.compact{padding:16px}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.card-sub{font-size:11px;color:var(--na-text-3);margin-top:2px}
.card-link{font-size:11px;color:var(--na-brand-text);white-space:nowrap}
.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid-deck{grid-template-columns:1.55fr 1fr}
.grid-13{grid-template-columns:1.25fr 1fr 1fr}
.stack-gap{display:flex;flex-direction:column;gap:20px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;font-size:11px;line-height:1.4;border:1px solid transparent;white-space:nowrap}
.badge .dot{width:5px;height:5px}
.badge.ok{color:var(--na-ok-ink);background:var(--na-ok-soft);border-color:rgba(46,107,69,.22)}
.badge.brand{color:var(--na-brand-text);background:var(--na-brand-soft);border-color:rgba(31,95,91,.24)}
.badge.amber{color:var(--na-signal-ink);background:var(--na-signal-soft);border-color:rgba(184,72,44,.26)}
.badge.danger{color:var(--na-danger-ink);background:var(--na-danger-soft);border-color:rgba(163,58,52,.24)}
.badge.neutral{color:var(--na-text-2);background:rgba(104,123,125,.09);border-color:rgba(104,123,125,.18)}
.badge.stale{color:var(--na-stale);background:transparent;border:1px dashed rgba(104,123,125,.42)}
.badge.disputed{color:#8A4A18;background:rgba(162,85,26,.1);border-color:rgba(162,85,26,.26)}
.badge.evidence{color:#1F6257;background:var(--na-evidence-soft);border-color:rgba(44,122,107,.24)}
.badge.tiny{font-size:10px;padding:1px 6px}
.badge.square{border-radius:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--na-border);background:transparent;color:var(--na-text-2);font-size:11px;white-space:nowrap}
.chip:hover{background:rgba(27,42,46,0.076);border-color:var(--na-border-strong);color:var(--na-text);text-decoration:none}
.chip[aria-pressed="true"],.chip.active{background:var(--na-brand-soft);border-color:rgba(31,95,91,.4);color:var(--na-brand-text)}
.chip .x{color:var(--na-text-3);font-size:12px;margin-left:2px}
.chip.amber[aria-pressed="true"]{background:var(--na-signal-soft);border-color:rgba(184,72,44,.4);color:var(--na-signal-ink)}

/* status priority helpers */
[data-tone="ok"]{color:var(--na-ok-ink)}
[data-tone="brand"]{color:var(--na-brand-text)}
[data-tone="amber"]{color:var(--na-signal-ink)}
[data-tone="danger"]{color:var(--na-danger-ink)}
[data-tone="stale"]{color:var(--na-stale)}

/* model / drift badges */
.model-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--na-text-2);background:var(--na-sunken);border:1px solid var(--na-border);border-radius:5px;padding:2px 6px;white-space:nowrap;max-width:100%}
.model-badge .src{font-family:var(--na-font-mono);font-size:9px;font-weight:600;border-radius:3px;padding:0 3px;line-height:14px;background:rgba(104,123,125,.14);color:var(--na-text-2)}
.model-badge .src.a{background:var(--na-brand-soft);color:var(--na-brand-text)}
.model-badge .src.t{background:var(--na-signal-soft);color:var(--na-signal-ink)}
.model-badge .h{width:5px;height:5px;border-radius:50%;background:var(--na-ok)}
.model-badge .h.degraded{background:var(--na-warn)}
.model-badge .h.blocked{background:var(--na-danger)}
.model-badge .nm{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.drift-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--na-signal-ink);background:var(--na-signal-soft);border:1px solid rgba(184,72,44,.24);border-radius:4px;padding:2px 6px;font-family:var(--na-font-mono);white-space:nowrap}
.drift-badge.bad{color:var(--na-danger-ink);background:var(--na-danger-soft);border-color:rgba(163,58,52,.3)}

/* gates */
.gate-ladder{display:flex;align-items:flex-start;width:100%;margin-top:10px}
.gate{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.gate::before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:1px;background:var(--na-border-strong);z-index:0}
.gate:first-child::before{display:none}
.gate-sq{width:17px;height:17px;border-radius:4px;border:1px solid var(--na-border-strong);background:var(--na-sunken);display:grid;place-items:center;font-family:var(--na-font-mono);font-size:9px;line-height:1;position:relative;z-index:1;color:var(--na-text-3)}
.gate-lb{font-family:var(--na-font-mono);font-size:9.5px;color:var(--na-text-3);letter-spacing:.02em}
.gate-st{font-size:10px;color:var(--na-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gate.pass .gate-sq{background:var(--na-ok);border-color:var(--na-ok);color:#FCFAF4}
.gate.pass .gate-st{color:var(--na-ok-ink)}
.gate.fail .gate-sq{background:var(--na-danger);border-color:var(--na-danger);color:#FCFAF4}
.gate.fail .gate-st{color:var(--na-danger-ink)}
.gate.blocked .gate-sq{background:var(--na-signal);border-color:var(--na-signal);color:#FCFAF4}
.gate.blocked .gate-st{color:var(--na-signal-ink)}
.gate.na .gate-sq{background:repeating-linear-gradient(135deg,rgba(27,42,46,0.16) 0 2px,transparent 2px 4px),var(--na-sunken);color:var(--na-text-3)}
.gate.na .gate-st{color:var(--na-text-3)}
.gate[data-click]{cursor:pointer}
.gate[data-click]:hover .gate-sq{border-color:var(--na-brand-text)}
.gate-dots{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.gate-dots i{width:7px;height:7px;border-radius:2px;display:block;background:var(--na-line)}
.gate-dots i.pass{background:var(--na-ok)}
.gate-dots i.fail{background:var(--na-danger)}
.gate-dots i.blocked{background:var(--na-signal)}
.gate-dots i.na{background:repeating-linear-gradient(135deg,rgba(27,42,46,0.16) 0 2px,transparent 2px 4px),var(--na-line)}

/* chart progress */
.chartbar{display:flex;flex-direction:column;gap:7px}
.chartbar .track{height:6px;background:var(--na-sunken);border-radius:999px;overflow:hidden;position:relative}
.chartbar .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--na-brand-600),var(--na-brand));position:relative}
.chartbar .fill.ok{background:linear-gradient(90deg,#216256,var(--na-ok))}
.chartbar .fill.bad{background:linear-gradient(90deg,#7C2A18,var(--na-danger))}
.chartbar .fill.amber{background:linear-gradient(90deg,#7A4B12,var(--na-signal))}
.chartbar .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(27,42,46,0.16),transparent);transform:translateX(-100%);animation:sweep 1.8s linear infinite}
.chartbar.static .fill::after{display:none}
@keyframes sweep{to{transform:translateX(100%)}}
.chartbar .scale{display:flex;justify-content:space-between;font-family:var(--na-font-mono);font-size:10px;color:var(--na-text-3);letter-spacing:.02em}
.chartbar .scale span.on{color:var(--na-brand-text)}
.chartbar .scale span.done{color:var(--na-ok-ink)}

/* tables */
.table-wrap{overflow:auto;border:1px solid var(--na-border);border-radius:var(--na-r-xl);background:var(--na-card)}
table.data{font-size:12px;min-width:720px}
table.data thead th{
  text-align:left;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--na-text-3);
  background:var(--na-sunken);padding:9px 12px;border-bottom:1px solid var(--na-border);white-space:nowrap;
  position:sticky;top:0;z-index:1;
}
table.data td{padding:11px 12px;border-bottom:1px solid var(--na-border-hairline);vertical-align:middle;color:var(--na-text-2)}
table.data tbody tr:last-child td{border-bottom:0}
table.data tbody tr{transition:background-color .12s}
table.data tbody tr:hover{background:var(--na-brand-wash)}
tr.clickable{cursor:pointer}
tr.selected{background:var(--na-brand-soft)}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--na-font-mono);font-size:11px}
td.actions{text-align:right;white-space:nowrap}
.cell-title{font-size:12.5px;font-weight:600;color:var(--na-text);line-height:1.35;max-width:420px}
.cell-meta{font-size:10.5px;color:var(--na-text-3);margin-top:2px;font-family:var(--na-font-mono)}
.cell-sub{font-size:10.5px;color:var(--na-text-3);margin-top:2px}
.table-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 2px 0;font-size:11px;color:var(--na-text-3)}
.pager{display:flex;gap:4px}
.pager button{min-width:26px;height:26px;border-radius:4px;border:1px solid var(--na-border);color:var(--na-text-2);font-size:11px;background:transparent}
.pager button.on{background:var(--na-brand-soft);border-color:rgba(31,95,91,.36);color:var(--na-brand-text)}

/* metric strip */
.metric-strip{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  background:linear-gradient(180deg,rgba(27,42,46,0.042),transparent),var(--na-card);
  border:1px solid var(--na-border);border-radius:var(--na-r-xl);overflow:hidden;margin-bottom:20px;
}
.metric{padding:14px 18px;border-left:1px solid var(--na-border);min-width:0}
.metric:first-child{border-left:0}
.metric .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--na-text-3);font-family:var(--na-font-mono)}
.metric .v{font-family:var(--na-font-display);font-size:24px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.metric .v small{font-family:var(--na-font-sans);font-size:11px;color:var(--na-text-3);letter-spacing:0;margin-left:3px}
.metric .n{font-size:10.5px;color:var(--na-text-3);margin-top:2px}

/* hero deck */
.hero-deck{
  position:relative;overflow:hidden;border:1px solid var(--na-border);border-radius:var(--na-r-2xl);
  background:
    radial-gradient(700px 260px at 12% -10%,rgba(31,95,91,.16),transparent 64%),
    radial-gradient(420px 200px at 86% 116%,rgba(184,72,44,.06),transparent 70%),
    linear-gradient(180deg,rgba(27,42,46,0.048),transparent 52%),var(--na-card);
  box-shadow:var(--na-shadow-card);
  display:grid;grid-template-columns:1.55fr 1fr;min-height:288px;
}
.hero-main{padding:24px 26px 20px;position:relative;z-index:1;min-width:0}
.hero-main .h-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero-main .hero-title{margin-top:14px;font-size:30px}
.hero-main .hero-sub{color:var(--na-text-3);font-size:12.5px;margin-top:7px;max-width:52ch}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:22px;border-top:1px solid var(--na-border-hairline);border-bottom:1px solid var(--na-border-hairline);padding:12px 0}
.hstat{padding:0 14px;border-left:1px solid var(--na-border-hairline)}
.hstat:first-child{border-left:0;padding-left:0}
.hstat .k{font-size:10px;color:var(--na-text-3);letter-spacing:.06em;text-transform:uppercase;font-family:var(--na-font-mono)}
.hstat .v{font-family:var(--na-font-display);font-size:26px;line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.hstat .v small{font-family:var(--na-font-sans);font-size:10px;color:var(--na-text-3);letter-spacing:0;margin-left:3px}
.hero-lower{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:16px}
.hero-lower .lbl{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--na-text-3);font-family:var(--na-font-mono);letter-spacing:.06em;margin-bottom:8px}
.ark-watermark{position:absolute;right:-10px;bottom:-18px;width:340px;height:340px;opacity:.085;pointer-events:none;color:var(--na-brand-text)}
.hero-queue{background:rgba(184,72,44,.035);border-left:1px solid var(--na-border);padding:20px 20px 16px;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}
.hero-queue .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hero-queue .q-title{font-size:13px;font-weight:600;color:var(--na-signal-ink)}
.queue-row{padding:13px 0;border-top:1px solid rgba(184,72,44,.13);display:flex;flex-direction:column;gap:7px}
.queue-row:first-of-type{border-top:1px solid var(--na-border-hairline)}
.queue-row .qr-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.queue-row .qr-id{font-family:var(--na-font-mono);font-size:10px;color:var(--na-text-3)}
.queue-row .qr-title{font-size:12px;line-height:1.35;font-weight:500;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.queue-row .qr-why{font-size:10.5px;color:var(--na-signal-ink)}
.queue-row .qr-acts{display:flex;align-items:center;gap:6px;justify-content:space-between}
.queue-row .qr-time{font-family:var(--na-font-mono);font-size:10px;color:var(--na-text-3)}
.queue-empty{margin:auto;text-align:center;color:var(--na-text-3);font-size:12px;padding:24px 0}

/* event tape */
.tape{display:flex;flex-direction:column;gap:0;position:relative}
.tape-item{display:grid;grid-template-columns:10px 1fr auto;gap:9px;padding:8px 0;position:relative;align-items:start}
.tape-item::before{content:"";position:absolute;left:4px;top:17px;bottom:-8px;width:1px;background:var(--na-border)}
.tape-item:last-child::before{display:none}
.tape-item .tdot{width:9px;height:9px;border-radius:50%;background:var(--na-line);border:1px solid var(--na-border-strong);margin-top:5px;position:relative;z-index:1}
.tape-item.warn .tdot{background:var(--na-signal);border-color:var(--na-signal)}
.tape-item.ok .tdot{background:var(--na-ok);border-color:var(--na-ok)}
.tape-item.bad .tdot{background:var(--na-danger);border-color:var(--na-danger)}
.tape-item .tt{font-size:11px;line-height:1.45}
.tape-item .tm{font-family:var(--na-font-mono);font-size:9.5px;color:var(--na-text-3);white-space:nowrap}
.tape-item .ts{font-family:var(--na-font-mono);font-size:9px;color:var(--na-text-3)}

/* lists */
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--na-border-hairline)}
.list-row:first-child{border-top:0;padding-top:0}
.list-row .lr-main{min-width:0;flex:1}
.list-row .lr-t{font-size:12px;font-weight:500;line-height:1.4}
.list-row .lr-s{font-size:10.5px;color:var(--na-text-3);margin-top:2px}
.list-row .lr-r{font-size:10.5px;color:var(--na-text-3);white-space:nowrap;font-family:var(--na-font-mono)}

/* task table specifics */
.task-title{font-size:12.5px;font-weight:600;color:var(--na-text);line-height:1.35;max-width:430px}
.task-id{font-family:var(--na-font-mono);font-size:10px;color:var(--na-text-3);margin-top:2px}
.mini-bar{display:flex;align-items:center;gap:7px}
.mini-bar .mb{width:58px;height:4px;border-radius:999px;background:var(--na-line);overflow:hidden;flex:none}
.mini-bar .mb i{display:block;height:100%;background:var(--na-brand);border-radius:999px}
.mini-bar .mb i.ok{background:var(--na-ok)}
.mini-bar .mb i.bad{background:var(--na-danger)}
.mini-bar .mb i.amber{background:var(--na-signal)}
.mini-bar .pc{font-family:var(--na-font-mono);font-size:10px;color:var(--na-text-3)}

/* detail */
.task-head{padding-bottom:16px;border-bottom:1px solid var(--na-border);margin-bottom:0}
.task-head h1{font-family:var(--na-font-display);font-size:24px;line-height:1.25;letter-spacing:-.02em;font-weight:600;margin-top:5px;max-width:1000px}
.task-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--na-text-3)}
.task-meta .sep{opacity:.4}
.task-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.task-progress{margin-top:16px}
.task-progress .row-between{margin-bottom:8px}
.task-gates{margin-top:14px}
.task-gates .gate-ladder{margin-top:8px}
.gate-note{font-size:11px;color:var(--na-text-3);margin-top:8px;display:flex;align-items:center;gap:6px}
.gate-note b{font-weight:500;color:var(--na-signal-ink)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;margin-top:0}
.tabbar{
  display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--na-border);
  position:sticky;top:0;background:var(--na-canvas);z-index:20;margin:0 -2px 18px;padding:0 2px;
  scrollbar-width:thin;
}
.tabbar::-webkit-scrollbar{height:4px}
.tab{position:relative;padding:11px 11px 10px;color:var(--na-text-3);font-size:12px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--na-text-2)}
.tab[aria-selected="true"]{color:var(--na-text);font-weight:600;border-bottom-color:var(--na-brand)}
.tab .cnt{font-family:var(--na-font-mono);font-size:9.5px;color:var(--na-text-3);margin-left:4px}
.tabpanel{display:flex;flex-direction:column;gap:16px;min-width:0}
.ctx{display:flex;flex-direction:column;gap:14px;position:sticky;top:54px}
.ctx-card{background:rgba(252,250,244,.68);border:1px solid var(--na-border);border-radius:var(--na-r-lg);padding:12px}
.ctx-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--na-text-3);font-family:var(--na-font-mono);margin-bottom:8px}
.ctx-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;font-size:11px;border-top:1px solid var(--na-border-hairline)}
.ctx-row:first-of-type{border-top:0}
.ctx-row .ck{color:var(--na-text-3)}
.ctx-row .cv{color:var(--na-text-2);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-note{font-size:10px;color:var(--na-text-3);line-height:1.5;margin-top:6px}
.copy-inline{font-family:var(--na-font-mono);font-size:10.5px;color:var(--na-text-2);background:var(--na-sunken);border:1px solid var(--na-border);border-radius:4px;padding:1px 5px;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-inline:hover{border-color:var(--na-border-strong)}

/* tab content bits */
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:9px 16px;font-size:12px}
.kv dt{color:var(--na-text-3);font-size:11px}
.kv dd{margin:0;color:var(--na-text-2);min-width:0}
.callout{display:flex;gap:10px;padding:12px 14px;border-radius:8px;background:rgba(27,42,46,0.048);border:1px solid var(--na-border);font-size:11.5px;color:var(--na-text-2);line-height:1.55}
.callout .ci{flex:none;width:16px;height:16px;color:var(--na-text-3);margin-top:1px}
.callout.amber{background:rgba(184,72,44,.06);border-color:rgba(184,72,44,.2)}
.callout.amber .ci{color:var(--na-signal-ink)}
.callout.bad{background:rgba(163,58,52,.06);border-color:rgba(163,58,52,.22)}
.callout.bad .ci{color:var(--na-danger-ink)}
.callout.ok{background:rgba(46,107,69,.05);border-color:rgba(46,107,69,.18)}
.callout.ok .ci{color:var(--na-ok-ink)}
.callout b{color:var(--na-text);font-weight:600}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:var(--na-font-mono);text-transform:uppercase;letter-spacing:.05em}
.sev.blocking{color:var(--na-danger-ink)}
.sev.major{color:var(--na-signal-ink)}
.sev.minor{color:var(--na-text-3)}
.timeline{display:flex;flex-direction:column;position:relative}
.tl-item{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:0 0 14px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:5px;top:16px;bottom:0;width:1px;background:var(--na-border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--na-border-strong);background:var(--na-card);margin-top:3px;z-index:1}
.tl-item.done .tl-dot{background:var(--na-ok);border-color:var(--na-ok)}
.tl-item.active .tl-dot{background:var(--na-brand);border-color:var(--na-brand);box-shadow:0 0 0 3px rgba(31,95,91,.16)}
.tl-item.fail .tl-dot{background:var(--na-danger);border-color:var(--na-danger)}
.tl-item.wait .tl-dot{background:var(--na-signal);border-color:var(--na-signal)}
.tl-t{font-size:12px;font-weight:500;line-height:1.4}
.tl-s{font-size:10.5px;color:var(--na-text-3);margin-top:2px}
.tl-r{font-family:var(--na-font-mono);font-size:10px;color:var(--na-text-3);margin-top:2px}

/* case/evidence rows */
.case-row{border-top:1px solid var(--na-border-hairline);padding:10px 0}
.case-row:first-child{border-top:0;padding-top:0}
.case-top{display:grid;grid-template-columns:64px minmax(0,1fr) 100px 100px 86px;gap:10px;align-items:center;font-size:11.5px}
.case-id{font-family:var(--na-font-mono);font-size:10.5px;color:var(--na-brand-text)}
.case-title{font-weight:500;color:var(--na-text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.case-meta{font-size:10px;color:var(--na-text-3)}
.ev-group{border-top:1px solid var(--na-border-hairline);padding:12px 0}
.ev-group:first-child{border-top:0;padding-top:0}
.ev-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.ev-file{display:grid;grid-template-columns:18px minmax(0,1fr) 76px 112px 88px 92px;gap:10px;align-items:center;padding:6px 0;font-size:11px;border-top:1px dashed rgba(27,42,46,0.095)}
.ev-file:first-of-type{border-top:0}
.ev-file .fn{color:var(--na-text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-file .sz,.ev-file .hs,.ev-file .tm{font-family:var(--na-font-mono);font-size:10px;color:var(--na-text-3);white-space:nowrap}
.ev-file.missing{background:rgba(184,72,44,.05);border-radius:6px;padding:7px 8px;margin:2px 0}
.ev-file.invalid{background:rgba(163,58,52,.05);border-radius:6px;padding:7px 8px;margin:2px 0}
.ev-file .acts{text-align:right;white-space:nowrap}

/* terminal */
.terminal{
  background:var(--na-terminal);border:1px solid #2C403D;border-radius:var(--na-r-lg);
  box-shadow:0 1px 0 rgba(27,42,46,0.057) inset,0 0 48px rgba(0,0,0,.45) inset;
  padding:14px 16px;font-family:var(--na-font-mono);font-size:11.5px;line-height:1.75;color:#E7E3D6;
  overflow:auto;min-height:320px;max-height:calc(100dvh - 300px);
}
.term-line{white-space:pre-wrap;overflow-wrap:anywhere}
.term-line .t{color:#8FA39D;margin-right:8px;font-size:10px}
.term-line .r{color:var(--na-brand-text)}
.term-line .ok{color:var(--na-ok-ink)}
.term-line .warn{color:var(--na-signal-ink)}
.term-line .bad{color:var(--na-danger-ink)}
.term-line .dim{color:#8FA39D}
.term-divider{display:flex;align-items:center;gap:10px;margin:9px 0;color:#8FA39D;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.term-divider::before,.term-divider::after{content:"";height:1px;background:#D8D2C4;flex:1}
.term-input{display:flex;align-items:center;gap:8px;border-top:1px solid var(--na-border);background:var(--na-panel);padding:10px 12px}
.term-input .prompt{font-family:var(--na-font-mono);color:var(--na-brand-text);font-size:12px}
.term-input textarea{flex:1;background:transparent;border:0;resize:none;color:var(--na-text);font-family:var(--na-font-mono);font-size:12px;line-height:1.5;min-height:36px;max-height:110px;padding:6px 0;outline:none}
.term-input textarea::placeholder{color:var(--na-text-3)}

/* specific: tasks filter */
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.search-box{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--na-border);border-radius:6px;background:var(--na-card);min-width:260px;flex:1;max-width:420px}
.search-box svg{width:15px;height:15px;color:var(--na-text-3);flex:none}
.search-box input{flex:1;background:transparent;border:0;outline:none;font-size:12px;color:var(--na-text);min-width:0}
.search-box input::placeholder{color:var(--na-text-3)}
.select{height:32px;padding:0 26px 0 9px;border:1px solid var(--na-border);border-radius:6px;background:var(--na-card);color:var(--na-text-2);font-size:11.5px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--na-text-3) 50%),linear-gradient(135deg,var(--na-text-3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat;
}
.select:hover{border-color:var(--na-border-strong)}
.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* overview specifics */
.ov-row2{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:20px;margin-top:20px}
.ov-nodes{margin-top:20px}
.node-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.node-mini{background:rgba(27,42,46,0.034);border:1px solid var(--na-border);border-radius:8px;padding:12px}
.node-mini .nm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:500}
.node-mini .meta{font-size:10.5px;color:var(--na-text-3);margin-top:5px}
.node-mini .bar{height:3px;background:var(--na-line);border-radius:999px;margin-top:9px;overflow:hidden}
.node-mini .bar i{display:block;height:100%;background:var(--na-brand);border-radius:999px}
.node-mini.off{opacity:.7}
.node-mini.off .nm{color:var(--na-text-2)}

/* think */
.think-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.steps{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--na-text-3);padding:5px 9px;border-radius:999px;border:1px solid transparent}
.step.on{background:var(--na-brand-soft);color:var(--na-brand-text);border-color:rgba(31,95,91,.28)}
.step.done{color:var(--na-ok-ink)}
.step .sn{width:17px;height:17px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-family:var(--na-font-mono);font-size:9px}
.step-sec{padding:18px 0;border-top:1px solid var(--na-border)}
.step-sec:first-of-type{border-top:0;padding-top:0}
.step-sec h3{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.step-sec .sec-sub{font-size:11px;color:var(--na-text-3);margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:10.5px;color:var(--na-text-3)}
.input,.textarea{background:var(--na-sunken);border:1px solid var(--na-border);border-radius:6px;color:var(--na-text);font-size:12px;padding:8px 10px;outline:none;min-width:0}
.input:focus,.textarea:focus{border-color:var(--na-brand);box-shadow:0 0 0 3px rgba(31,95,91,.14)}
.textarea{min-height:110px;resize:vertical;line-height:1.6}
.q-item{border:1px solid var(--na-border);border-radius:8px;padding:12px;margin-bottom:8px;background:rgba(27,42,46,0.028)}
.q-item.blocking{border-color:rgba(184,72,44,.32);background:rgba(184,72,44,.04)}
.q-title{font-size:12px;font-weight:500;display:flex;align-items:flex-start;gap:8px}
.q-why{font-size:10.5px;color:var(--na-text-3);margin:4px 0 8px 18px}
.q-opts{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--na-text-2);margin-left:18px}
.q-opts label{display:inline-flex;align-items:center;gap:5px}
.think-rail{position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
.think-bottom{position:sticky;bottom:-24px;background:linear-gradient(180deg,transparent,var(--na-canvas) 30%);padding:12px 0 0;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:8px;z-index:10}
.validate-list{display:flex;flex-direction:column;gap:6px}
.validate{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--na-text-2);padding:3px 0}
.validate .vi{width:15px;height:15px;flex:none;display:grid;place-items:center;color:var(--na-text-3)}
.validate.ok .vi{color:var(--na-ok)}
.validate.bad .vi{color:var(--na-signal)}

/* knowledge */
.kb-search{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;border:1px solid var(--na-border-strong);border-radius:var(--na-r-xl);background:linear-gradient(180deg,rgba(27,42,46,0.048),transparent),var(--na-card);box-shadow:var(--na-shadow-card);margin-bottom:12px}
.kb-search svg{width:19px;height:19px;color:var(--na-brand-text);flex:none}
.kb-search input{flex:1;background:transparent;border:0;outline:none;font-size:15px;color:var(--na-text);min-width:0}
.kb-search input::placeholder{color:var(--na-text-3)}
.kb-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;margin-top:14px}
.kb-result{border:1px solid var(--na-border);border-radius:var(--na-r-xl);background:linear-gradient(180deg,rgba(27,42,46,0.038),transparent),var(--na-card);padding:16px 18px;margin-bottom:10px;transition:border-color .12s,background-color .12s;cursor:pointer}
.kb-result:hover{border-color:var(--na-border-strong);background:var(--na-card-hover)}
.kb-result .kr-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.kb-result .kr-title{font-size:14px;font-weight:600;line-height:1.4;letter-spacing:-.01em;max-width:72ch}
.kb-result .kr-why{font-size:11px;color:var(--na-text-3);margin-top:6px}
.kb-result .kr-app{font-size:10.5px;color:var(--na-text-3);margin-top:5px;font-family:var(--na-font-mono)}
.kb-result .kr-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--na-border-hairline);flex-wrap:wrap}
.kb-result .score{font-family:var(--na-font-mono);font-size:10px;color:var(--na-text-3);margin-left:auto}
.kb-side{position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
.gov-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--na-border-hairline);font-size:11px}
.gov-row:first-of-type{border-top:0}
.gov-row b{font-family:var(--na-font-mono);font-weight:500}
.article{max-width:76ch}
.article h2{font-size:15px;font-weight:600;margin:22px 0 8px}
.article h3{font-size:13px;font-weight:600;margin:16px 0 6px}
.article p{font-size:13px;line-height:1.75;color:var(--na-text-2);margin:8px 0}
.article li{font-size:12.5px;line-height:1.7;color:var(--na-text-2);margin:4px 0;padding-left:16px;position:relative}
.article li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--na-text-3)}
.cite{font-family:var(--na-font-mono);font-size:10px;color:var(--na-brand-text);background:var(--na-brand-soft);border-radius:4px;padding:0 4px;white-space:nowrap}

/* nodes */
.node-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.node-card{background:linear-gradient(180deg,rgba(27,42,46,0.038),transparent),var(--na-card);border:1px solid var(--na-border);border-radius:var(--na-r-xl);padding:16px;transition:border-color .12s,background-color .12s}
.node-card:hover{border-color:var(--na-border-strong);background:var(--na-card-hover)}
.node-card .nc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.node-card .nc-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.node-card .nc-meta{font-size:10.5px;color:var(--na-text-3);margin-top:5px;font-family:var(--na-font-mono)}
.node-card .nc-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:10.5px;color:var(--na-text-3)}
.node-card .nc-stats b{color:var(--na-text-2);font-weight:500}
.node-card .nc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:13px;padding-top:11px;border-top:1px solid var(--na-border-hairline)}
.util{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--na-text-3);margin-top:7px}
.util .ub{width:80px;height:3px;background:var(--na-line);border-radius:999px;overflow:hidden}
.util .ub i{display:block;height:100%;background:var(--na-brand);border-radius:999px}
.parse-box{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.parse-box .textarea{flex:1;min-height:64px}
.parse-preview{margin-top:12px;border-top:1px solid var(--na-border);padding-top:10px}

/* models */
.scope-tabs{display:inline-flex;background:var(--na-sunken);border:1px solid var(--na-border);border-radius:7px;padding:2px;gap:2px;margin-bottom:14px}
.scope-tabs button{padding:5px 14px;border-radius:5px;font-size:11.5px;color:var(--na-text-3)}
.scope-tabs button[aria-selected="true"]{background:var(--na-brand-soft);color:var(--na-brand-text);font-weight:600}
.effective{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding:10px 14px;border:1px solid var(--na-border);border-radius:8px;background:rgba(27,42,46,0.034);font-size:11px;color:var(--na-text-3)}
.effective b{color:var(--na-text-2);font-weight:500}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chain span{padding:2px 7px;border-radius:4px;background:var(--na-sunken);border:1px solid var(--na-border);font-family:var(--na-font-mono);font-size:10px}
.chain span.hit{background:var(--na-brand-soft);border-color:rgba(31,95,91,.3);color:var(--na-brand-text)}
.model-hero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.model-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.model-title{font-family:var(--na-font-display);font-size:24px;letter-spacing:-.02em;font-weight:600;line-height:1.2}
.model-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:10.5px;color:var(--na-text-3);font-family:var(--na-font-mono)}
.cap-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cap{font-family:var(--na-font-mono);font-size:10px;padding:2px 6px;border-radius:4px;background:var(--na-sunken);border:1px solid var(--na-border);color:var(--na-text-2)}
.cand{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-top:1px solid var(--na-border-hairline)}
.cand:first-child{border-top:0}
.cand .rank{font-family:var(--na-font-mono);font-size:10px;color:var(--na-text-3);width:14px;flex:none;margin-top:2px}
.cand .c-main{flex:1;min-width:0}
.cand .c-name{font-size:11.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .c-meta{font-size:9.5px;color:var(--na-text-3);margin-top:2px;font-family:var(--na-font-mono)}

/* toolchain */
.drift-banner{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid rgba(184,72,44,.28);border-radius:10px;background:rgba(184,72,44,.06);margin-bottom:18px}
.drift-banner .di{color:var(--na-signal-ink);flex:none;width:18px;height:18px;margin-top:1px}
.drift-banner .db-main{flex:1;min-width:0}
.drift-banner .db-t{font-size:12.5px;font-weight:600;color:var(--na-signal-ink)}
.drift-banner .db-s{font-size:11px;color:var(--na-text-2);margin-top:3px;line-height:1.55}
.drift-banner .db-acts{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.lock-summary{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:0;border:1px solid var(--na-border);border-radius:var(--na-r-xl);background:var(--na-card);overflow:hidden;margin-bottom:18px}
.lock-cell{padding:13px 16px;border-left:1px solid var(--na-border);min-width:0}
.lock-cell:first-child{border-left:0}
.lock-cell .k{font-size:10px;color:var(--na-text-3);font-family:var(--na-font-mono);text-transform:uppercase;letter-spacing:.06em}
.lock-cell .v{font-size:11.5px;color:var(--na-text-2);margin-top:4px;font-family:var(--na-font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.matrix td .comp{font-family:var(--na-font-mono);font-size:11px;color:var(--na-text)}
.version-state{display:inline-flex;align-items:center;gap:5px;font-size:10.5px}
.vs-ok{color:var(--na-ok-ink)}.vs-drift{color:var(--na-signal-ink)}.vs-bad{color:var(--na-danger-ink)}.vs-unknown{color:var(--na-text-3)}
.smoke-panel{display:flex;flex-direction:column;gap:8px}
.smoke-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--na-border-hairline);font-size:11px}
.smoke-row:first-child{border-top:0}

/* push */
.channel{display:inline-flex;align-items:center;gap:5px;font-family:var(--na-font-mono);font-size:9.5px;padding:2px 6px;border-radius:4px;border:1px solid var(--na-border);color:var(--na-text-2);background:var(--na-sunken)}
.channel.webhook{color:var(--na-brand-text);border-color:rgba(31,95,91,.24);background:var(--na-brand-soft)}
.channel.terminal{color:#43585B;background:rgba(104,123,125,.09)}
.channel.file{color:var(--na-text-2)}
.channel.sse{color:var(--na-evidence);border-color:rgba(44,122,107,.22);background:var(--na-evidence-soft)}
.switch{width:34px;height:20px;border-radius:999px;background:var(--na-line);border:1px solid var(--na-border-strong);position:relative;flex:none;transition:background-color .12s,border-color .12s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#98A5A3;transition:transform .15s,background-color .15s}
.switch[aria-pressed="true"]{background:var(--na-brand-600);border-color:var(--na-brand-600)}
.switch[aria-pressed="true"]::after{transform:translateX(14px);background:#fff}
.delivery{display:grid;grid-template-columns:52px minmax(0,1fr) 58px 44px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--na-border-hairline);font-size:10.5px}
.delivery:first-child{border-top:0}
.delivery .d-time{font-family:var(--na-font-mono);color:var(--na-text-3)}
.delivery .d-ev{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--na-text-2)}
.delivery .d-st{font-family:var(--na-font-mono);font-size:10px;text-align:right}
.delivery .d-at{font-family:var(--na-font-mono);font-size:9.5px;color:var(--na-text-3);text-align:right}

/* agents */
.agent-detail{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start;margin-top:18px}
.agent-kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 16px;font-size:11.5px}
.agent-kv dt{color:var(--na-text-3)}
.agent-kv dd{margin:0;color:var(--na-text-2)}
.scope-code{font-family:var(--na-font-mono);font-size:10.5px;color:var(--na-text-2);background:var(--na-sunken);border:1px solid var(--na-border);border-radius:4px;padding:1px 5px}
.diff{font-family:var(--na-font-mono);font-size:11px;line-height:1.7;background:var(--na-terminal);border:1px solid var(--na-border);border-radius:6px;padding:12px;overflow:auto}
.diff .del{color:var(--na-danger-ink);background:rgba(163,58,52,.07);display:block}
.diff .add{color:var(--na-ok-ink);background:rgba(46,107,69,.07);display:block}

/* roundtable */
.rt-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.rt-main{min-width:0}
.rt-form .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.rt-result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.rt-col{border:1px solid var(--na-border);border-radius:10px;padding:13px;background:rgba(27,42,46,0.028)}
.rt-col h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--na-text-3);font-family:var(--na-font-mono);margin-bottom:8px}
.rt-item{font-size:11.5px;line-height:1.6;color:var(--na-text-2);padding:6px 0;border-top:1px solid var(--na-border-hairline);display:flex;gap:7px}
.rt-item:first-of-type{border-top:0}
.rt-item .ri{flex:none;color:var(--na-text-3);margin-top:2px}
.rt-item.disagree .ri{color:var(--na-disputed)}
.rt-item.risk .ri{color:var(--na-signal-ink)}
.rt-item.action .ri{color:var(--na-brand-text)}
.rt-round{border-top:1px solid var(--na-border);padding:10px 0}
.rt-round .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--na-text-2);cursor:pointer}
.rt-round .rbody{font-size:11px;color:var(--na-text-3);line-height:1.65;margin-top:7px}
.rt-history{position:sticky;top:0}

/* takeover */
.takeover-page{display:flex;flex-direction:column;gap:0;max-width:none!important}
.tk-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--na-border);border-bottom:0;border-radius:12px 12px 0 0;background:var(--na-card);flex-wrap:wrap}
.tk-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--na-text-3)}
.tk-status b{color:var(--na-text-2);font-weight:500}
.tk-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;border:1px solid var(--na-border);border-radius:0 0 12px 12px;overflow:hidden;background:var(--na-card)}
.tk-term{min-width:0;border-right:1px solid var(--na-border)}
.tk-term .terminal{min-height:430px;max-height:calc(100dvh - 270px);border:0;border-radius:0;box-shadow:none}
.tk-side{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tk-input{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--na-border);background:var(--na-panel);flex-wrap:wrap}
.tk-input textarea{flex:1;min-width:200px;min-height:38px;max-height:100px;background:var(--na-sunken);border:1px solid var(--na-border);border-radius:6px;padding:8px 10px;resize:none;font-family:var(--na-font-mono);font-size:11.5px;color:var(--na-text);outline:none}
.tk-input textarea:focus{border-color:var(--na-brand)}
.takeover-mode .rail{display:none}
.takeover-mode .app{grid-template-columns:1fr}
.takeover-mode .main{padding-top:16px}
.takeover-mode .topbar{display:none}
.takeover-mode .shell{grid-template-rows:minmax(0,1fr)}
.takeover-mode .bottom-nav{display:none}
.tk-back{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--na-text-3);margin-bottom:8px}

/* system */
.sys-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.sys-nav{position:sticky;top:0;display:flex;flex-direction:column;gap:1px}
.sys-nav a{padding:7px 10px;border-radius:5px;font-size:11.5px;color:var(--na-text-3)}
.sys-nav a:hover{background:rgba(27,42,46,0.076);color:var(--na-text);text-decoration:none}
.sys-nav a.on{background:var(--na-brand-soft);color:var(--na-brand-text)}
.sys-sec{scroll-margin-top:16px;margin-bottom:20px}
.switch-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--na-border-hairline)}
.switch-row:first-child{border-top:0}
.switch-row .sr-main{min-width:0}
.switch-row .sr-t{font-size:12px;font-family:var(--na-font-mono);color:var(--na-text)}
.switch-row .sr-s{font-size:10.5px;color:var(--na-text-3);margin-top:3px;line-height:1.5}
.switch-row .sr-meta{font-size:9.5px;color:var(--na-text-3);margin-top:3px}
.danger-zone{border-color:rgba(163,58,52,.28);background:rgba(163,58,52,.035)}
.danger-zone .card-title{color:var(--na-danger-ink)}

/* modal / drawer / toast / palette */
.overlay{position:fixed;inset:0;background:rgba(11,43,42,.72);z-index:400;display:grid;place-items:center;padding:20px;animation:fadeIn .16s ease}
.overlay.drawer{align-items:stretch;justify-items:end;padding:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--na-card-hover);border:1px solid var(--na-border-strong);border-radius:var(--na-r-2xl);box-shadow:var(--na-shadow-modal);width:min(560px,calc(100vw - 32px));max-height:86vh;overflow:auto;animation:modalIn .18s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}

/* ==========================================================================
   Voyage Ledger identity layer (v2.0). This block is the authoritative visual
   layer: paper canvas, ink rules, sea-teal navigation, vermilion human signal.
   ========================================================================== */
html{color-scheme:light}
body{
  background:
    linear-gradient(90deg,rgba(27,42,46,.035) 0 1px,transparent 1px),
    repeating-linear-gradient(180deg,rgba(27,42,46,.030) 0 1px,transparent 1px 48px),
    var(--na-canvas);
  background-size:100% 100%,100% 48px,auto;
  color:var(--na-text);
}
a{color:var(--na-link)}
::selection{background:rgba(31,95,91,.20)}
::-webkit-scrollbar-thumb{background:#C9C2B3;border-color:var(--na-canvas)}
::-webkit-scrollbar-thumb:hover{background:#B7B0A2}

/* prototype ribbon */
.proto-banner{
  height:28px;
  background:
    repeating-linear-gradient(135deg,rgba(184,72,44,.07) 0 6px,rgba(184,72,44,.02) 6px 12px),
    var(--na-canvas-deep);
  color:var(--na-signal-ink);
  border-bottom:1px solid rgba(184,72,44,.26);
  font-size:9.5px;letter-spacing:.12em;justify-content:flex-start;padding:0 18px;gap:10px;
}
.proto-banner b{color:var(--na-signal-ink);font-weight:600}
.proto-banner span{color:var(--na-text-3)}

/* shell */
.app{display:block;height:calc(100dvh - 28px)}
.shell{display:grid;grid-template-rows:var(--ribbon) var(--deck) minmax(0,1fr);height:100%;min-height:0;min-width:0}
.ribbon{
  height:var(--ribbon);display:flex;align-items:center;gap:10px;padding:0 20px;
  background:var(--na-terminal);color:var(--na-terminal-text);
  font-family:var(--na-font-mono);font-size:9px;letter-spacing:.10em;text-transform:uppercase;
  position:relative;z-index:210;overflow:hidden;white-space:nowrap;
}
.rb-left{display:flex;align-items:center;gap:8px;color:#FCFAF4;flex:none}
.rb-mark{font-weight:600;letter-spacing:.16em}
.rb-mid{display:flex;align-items:center;gap:8px;color:var(--na-terminal-dim);margin-left:14px;overflow:hidden;text-overflow:ellipsis}
.rb-right{margin-left:auto;display:flex;align-items:center;gap:8px;color:#C9D2CC;flex:none}
.rb-sep{opacity:.38}
.ribbon .conn{color:#C9D2CC;font-size:9px;gap:6px}
.ribbon .conn b{color:#FCFAF4;font-weight:500}
.ribbon .conn-seq{color:var(--na-terminal-dim)}

.deck{background:var(--na-panel);border-bottom:1px solid var(--na-border);position:relative;z-index:200;min-width:0}
.deck-top{height:var(--deck-top);display:flex;align-items:center;gap:12px;padding:0 var(--pad);border-bottom:1px solid var(--na-border-hairline);min-width:0}
.deck-brand{display:flex;align-items:center;gap:10px;color:var(--na-text);text-decoration:none;flex:none}
.deck-brand:hover{text-decoration:none;color:var(--na-text)}
.deck-brand .ark{width:30px;height:30px;color:var(--na-text);flex:none}
.deck-word{display:flex;flex-direction:column;line-height:1;min-width:0}
.deck-word .wordmark{font-family:var(--na-font-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.deck-word .wordmark em{font-style:normal;color:var(--na-brand)}
.deck-word .tag{font-family:var(--na-font-mono);font-size:8px;letter-spacing:.16em;color:var(--na-text-3);margin-top:4px}
.deck-spacer{flex:1;min-width:8px}
.top-search{
  margin-left:10px;height:30px;min-width:200px;max-width:360px;flex:1;
  background:var(--na-card);border:1px solid var(--na-border);border-radius:3px;
  color:var(--na-text-3);padding:0 10px;
}
.top-search:hover{background:var(--na-card-hover);border-color:var(--na-border-strong)}
.top-search .kbd{border-radius:2px;color:var(--na-text-3)}
.live-chip{border-radius:2px;padding:3px 8px;font-family:var(--na-font-mono);font-size:9.5px;letter-spacing:.04em}
.user-btn{height:34px;padding:0 8px;gap:8px;border-color:transparent;background:transparent}
.user-btn:hover{background:var(--na-brand-wash);border-color:var(--na-border-hairline)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--na-brand-700);color:#FCFAF4;border:1px solid rgba(27,42,46,.18);font-size:10px}
.u-meta{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.u-name{font-size:11.5px;color:var(--na-text)}
.u-role{font-size:9.5px;color:var(--na-text-3)}

.deck-nav{height:var(--deck-nav);display:flex;align-items:stretch;padding:0 var(--pad);overflow-x:auto;scrollbar-width:none}
.deck-nav::-webkit-scrollbar{display:none}
.nav-item{
  width:auto;display:flex;align-items:center;gap:6px;padding:0 11px;
  font-size:12px;color:var(--na-text-2);text-align:left;position:relative;
  border-radius:0;border-bottom:2px solid transparent;background:none;white-space:nowrap;flex:none;
  transition:background-color .12s,color .12s,border-color .12s;
}
.nav-item:hover{background:var(--na-brand-wash);color:var(--na-text);text-decoration:none}
.nav-item[aria-current="page"]{background:var(--na-brand-soft);color:var(--na-text);font-weight:600;border-bottom-color:transparent}
.nav-item[aria-current="page"]::before{display:none}
.nav-item .ni{font-family:var(--na-font-mono);font-size:8.5px;letter-spacing:.06em;color:var(--na-text-3)}
.nav-item[aria-current="page"] .ni{background:var(--na-brand);color:#FCFAF4;padding:1px 3px;border-radius:2px}
.nav-item .nav-count{margin-left:2px;font-size:9px;color:var(--na-signal-ink);background:var(--na-signal-soft);border-radius:2px;padding:1px 4px}
.menu-btn{display:none}

.main{padding:26px var(--pad) 56px}
.page{max-width:1560px}

/* page header */
.page-head h1,.task-head h1{font-family:var(--na-font-display);font-weight:600}
.page-head h1{font-size:27px;line-height:1.2;letter-spacing:-.012em}
.task-head h1{font-size:26px;letter-spacing:-.012em}
.hero-title,.ledger-title{font-family:var(--na-font-display);font-weight:600;letter-spacing:-.015em}
.eyebrow{letter-spacing:.16em}
.eyebrow.brand{color:var(--na-brand)}
.eyebrow.amber{color:var(--na-signal-ink)}

/* buttons */
.btn{height:30px;border-radius:3px;background:transparent;border:1px solid var(--na-border);color:var(--na-text-2)}
.btn:hover{background:var(--na-brand-wash);border-color:var(--na-border-strong);color:var(--na-text)}
.btn:active{background:rgba(27,42,46,.06)}
.btn.primary{background:var(--na-brand);border-color:var(--na-brand);color:#FCFAF4}
.btn.primary:hover{background:var(--na-brand-600);border-color:var(--na-brand-600)}
.btn.amber{background:var(--na-signal);border-color:var(--na-signal);color:#FCFAF4}
.btn.amber:hover{background:#9A3822;border-color:#9A3822}
.btn.danger{border-color:rgba(163,58,52,.42);color:var(--na-danger-ink);background:var(--na-danger-soft)}
.btn.danger:hover{background:rgba(163,58,52,.16);border-color:rgba(163,58,52,.6)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:26px;border-radius:2px}
.btn.xs{height:22px;border-radius:2px}
.link.amber{color:var(--na-signal-ink)}

/* cards / surfaces */
.card{background:var(--na-card);border:1px solid var(--na-border);border-radius:4px;box-shadow:var(--na-shadow-card);padding:20px}
.card:hover{border-color:var(--na-border-strong)}
.card.compact{padding:16px}
.card.flat{box-shadow:none}
.card-title{font-size:13.5px}
.card-sub{font-size:10.5px}
.ctx-card{background:var(--na-panel);border-radius:3px}
.node-mini,.rt-col,.q-item,.effective{background:var(--na-panel);border-radius:3px}
.kb-result,.node-card,.kb-search{background:var(--na-card);border-radius:4px}
.kb-result:hover,.node-card:hover{background:var(--na-card-hover)}
.metric-strip{background:var(--na-card);border-radius:4px;box-shadow:var(--na-shadow-card)}
.metric-strip{border:1px solid var(--na-border)}
.model-badge,.copy-inline,.chain span,.cap,.scope-code,.channel{background:var(--na-panel);border-radius:2px}
.drift-badge{color:var(--na-warn-ink);background:var(--na-warn-soft);border-color:rgba(143,90,24,.28)}
.drift-badge.bad{color:var(--na-danger-ink);background:var(--na-danger-soft);border-color:rgba(163,58,52,.3)}

/* badges as ink stamps */
.badge{border-radius:2px;font-family:var(--na-font-mono);font-size:10px;letter-spacing:.02em;padding:2px 6px}
.badge.ok{color:var(--na-ok-ink);background:var(--na-ok-soft);border-color:rgba(46,107,69,.26)}
.badge.brand{color:var(--na-brand-600);background:var(--na-brand-soft);border-color:rgba(31,95,91,.26)}
.badge.amber{color:var(--na-signal-ink);background:var(--na-signal-soft);border-color:rgba(184,72,44,.28)}
.badge.danger{color:var(--na-danger-ink);background:var(--na-danger-soft);border-color:rgba(163,58,52,.26)}
.badge.neutral{color:var(--na-text-2);background:rgba(104,123,125,.08);border-color:rgba(104,123,125,.20)}
.badge.stale{color:var(--na-stale);border:1px dashed rgba(100,115,114,.5)}
.badge.disputed{color:#8A4A18;background:rgba(162,85,26,.10);border-color:rgba(162,85,26,.28)}
.badge.evidence{color:var(--na-evidence-ink);background:var(--na-evidence-soft);border-color:rgba(44,122,107,.28)}
.badge.tiny{font-size:9px;padding:1px 5px}
.badge.square{border-radius:2px}
.chip{border-radius:2px;height:26px;font-family:var(--na-font-mono);font-size:10px}
.chip:hover{background:var(--na-brand-wash)}
.chip[aria-pressed="true"],.chip.active{background:var(--na-brand-soft);border-color:rgba(31,95,91,.44);color:var(--na-brand-600)}
.chip.amber[aria-pressed="true"]{background:var(--na-signal-soft);border-color:rgba(184,72,44,.4);color:var(--na-signal-ink)}

/* gate stamps */
.gate-ladder{align-items:flex-start}
.gate::before{background:var(--na-border)}
.gate-sq{width:18px;height:18px;border-radius:2px;background:var(--na-sunken);border:1px solid var(--na-border-strong);font-size:8px;color:var(--na-text-3)}
.gate-lb{font-size:9px;color:var(--na-text-3)}
.gate-st{font-size:9.5px}
.gate.pass .gate-sq{background:var(--na-ok);border-color:var(--na-ok);color:#FCFAF4}
.gate.fail .gate-sq{background:var(--na-danger);border-color:var(--na-danger);color:#FCFAF4}
.gate.blocked .gate-sq{background:var(--na-signal);border-color:var(--na-signal);color:#FCFAF4}
.gate.na .gate-sq{background:repeating-linear-gradient(135deg,rgba(27,42,46,.12) 0 2px,transparent 2px 4px),var(--na-sunken)}
.gate-dots i{width:6px;height:6px;border-radius:1px;background:var(--na-sunken)}
.gate-dots i.pass{background:var(--na-ok)}.gate-dots i.fail{background:var(--na-danger)}.gate-dots i.blocked{background:var(--na-signal)}
.gate-dots i.na{background:repeating-linear-gradient(135deg,rgba(27,42,46,.16) 0 2px,transparent 2px 4px),var(--na-sunken)}

/* voyage ruler */
.chartbar .track{height:3px;border-radius:0;background:var(--na-sunken)}
.chartbar .fill{border-radius:0;background:var(--na-brand)}
.chartbar .fill.ok{background:var(--na-ok)}
.chartbar .fill.bad{background:var(--na-danger)}
.chartbar .fill.amber{background:var(--na-signal)}
.chartbar .fill::after{background:linear-gradient(90deg,transparent,rgba(252,250,244,.45),transparent)}
.chartbar .scale{font-size:9px}
.chartbar .scale span.on{color:var(--na-brand)}
.chartbar .scale span.done{color:var(--na-ok-ink)}

/* tables */
.table-wrap{border-radius:4px;background:var(--na-card);box-shadow:var(--na-shadow-card)}
table.data thead th{background:var(--na-sunken);color:var(--na-text-3);font-family:var(--na-font-mono);font-size:9px;letter-spacing:.10em;border-bottom:1px solid var(--na-border)}
table.data td{border-bottom:1px solid var(--na-border-hairline);color:var(--na-text-2)}
table.data tbody tr:hover{background:var(--na-brand-wash)}
.pager button{border-radius:2px;border-color:var(--na-border)}
.pager button.on{background:var(--na-brand-soft);border-color:rgba(31,95,91,.4);color:var(--na-brand-600)}

/* ledger spread (overview) */
.ledger-spread{
  display:grid;grid-template-columns:1.6fr 1fr;min-height:300px;
  border:1px solid var(--na-border);border-radius:4px;background:var(--na-card);
  box-shadow:var(--na-shadow-card);overflow:hidden;position:relative;
}
.ledger-main{padding:24px 26px 20px;min-width:0;position:relative;z-index:1;
  background:linear-gradient(180deg,rgba(31,95,91,.035),transparent 46%)}
.ledger-main .h-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ledger-title{margin-top:14px;font-size:34px;line-height:1.16;max-width:22ch}
.ledger-sub{color:var(--na-text-3);font-size:12.5px;margin-top:8px;max-width:54ch}
.ledger-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:22px;padding:12px 0;border-top:1px solid var(--na-border-hairline);border-bottom:1px solid var(--na-border-hairline)}
.lstat{padding:0 14px;border-left:1px solid var(--na-border-hairline);min-width:0}
.lstat:first-child{border-left:0;padding-left:0}
.lstat .k{font-family:var(--na-font-mono);font-size:9px;color:var(--na-text-3);letter-spacing:.08em;text-transform:uppercase}
.lstat .v{font-family:var(--na-font-display);font-size:30px;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.lstat .v small{font-family:var(--na-font-sans);font-size:10px;color:var(--na-text-3);margin-left:3px}
.lstat .faint{font-size:9.5px;margin-top:2px}
.ledger-lower{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:16px}
.ledger-lower .lbl{display:flex;justify-content:space-between;align-items:center;font-family:var(--na-font-mono);font-size:9px;color:var(--na-text-3);letter-spacing:.06em;margin-bottom:8px}
.ark-watermark{position:absolute;right:-12px;bottom:-20px;width:330px;height:330px;opacity:.055;pointer-events:none;color:var(--na-brand)}
.decision-margin{
  border-left:1px solid var(--na-border);padding:20px 20px 16px;
  background:linear-gradient(180deg,rgba(184,72,44,.055),transparent 46%),var(--na-card);
  display:flex;flex-direction:column;min-width:0;position:relative;z-index:1;
}
.decision-margin .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.decision-margin .q-title{font-size:12.5px;font-weight:600;color:var(--na-signal-ink);font-family:var(--na-font-mono);letter-spacing:.04em}
.decision-margin .faint{font-size:9.5px}
.decision-margin .queue-row{padding:13px 0;border-top:1px solid rgba(184,72,44,.16);display:flex;flex-direction:column;gap:7px}
.decision-margin .queue-row:first-of-type{border-top:1px solid var(--na-border-hairline)}
.decision-margin .queue-row .qr-why{color:var(--na-signal-ink)}
.queue-empty{margin:auto;text-align:center;color:var(--na-text-3);font-size:12px;padding:24px 0}

.ledger-row2{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}
.ledger-wide,.ledger-narrow{display:flex;flex-direction:column;gap:20px;min-width:0}
.ledger-narrow .card{flex:1}
.exc-table{min-width:0;overflow-x:auto}
.exc-table table{font-size:11.5px}
.exc-table th{background:transparent;border-bottom:1px solid var(--na-border);padding:7px 8px}
.exc-table td{padding:8px;border-bottom:1px solid var(--na-border-hairline)}
.exc-table tr:last-child td{border-bottom:0}
.signal-block{padding:10px 0;border-top:1px solid var(--na-border-hairline)}
.signal-block:first-child{border-top:0;padding-top:0}
.signal-block .sb-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--na-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--na-text-3);margin-bottom:8px}
.node-mini{background:var(--na-panel);border-radius:3px}
.node-mini .bar{height:3px;border-radius:0;background:var(--na-sunken)}
.node-mini .bar i{background:var(--na-brand);border-radius:0}

/* context strip */
.context-strip{display:flex;align-items:center;gap:10px;height:36px;margin:-4px 0 14px;padding:0 2px;border-bottom:1px solid var(--na-border-hairline);font-family:var(--na-font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--na-text-3);overflow:hidden;white-space:nowrap}
.context-strip .cs-sep{opacity:.45}
.context-strip .cs-now{color:var(--na-text)}
.context-strip .cs-stat{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--na-text-2)}

/* detail tabs as folio index */
.tabbar{background:var(--na-canvas);border-bottom:1px solid var(--na-border);top:0;margin:0 0 18px;gap:0}
.tab{padding:10px 12px 9px;font-family:var(--na-font-mono);font-size:10.5px;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{font-weight:600;background:var(--na-brand-soft);border-bottom-color:transparent}
.tab[aria-selected="true"]::before{content:"";display:inline-block;width:4px;height:4px;margin-right:6px;vertical-align:2px;background:var(--na-brand)}
.ctx{top:8px}
.ctx-card{background:var(--na-panel);border:1px solid var(--na-border);border-radius:3px}

/* terminal: machine speaks on dark ink only */
.terminal{
  background:var(--na-terminal);border:1px solid var(--na-terminal-line);border-radius:4px;
  color:var(--na-terminal-text);
  box-shadow:0 1px 0 rgba(231,227,214,.05) inset,0 0 44px rgba(0,0,0,.35) inset;
}
.term-line .t{color:var(--na-terminal-dim)}
.term-line .r{color:#89B7AA}
.term-line .ok{color:#A9D3B8}
.term-line .warn{color:#D9A46E}
.term-line .bad{color:#E29A94}
.term-line .dim{color:var(--na-terminal-dim)}
.term-divider{color:var(--na-terminal-dim)}
.term-divider::before,.term-divider::after{background:var(--na-terminal-line)}
.term-input{background:var(--na-terminal-raised);border-top:1px solid var(--na-terminal-line)}
.term-input .prompt{color:#89B7AA}
.term-input textarea{color:var(--na-terminal-text)}
.term-input textarea::placeholder{color:var(--na-terminal-dim)}
.tk-bar{background:var(--na-panel);border-radius:4px 4px 0 0}
.tk-body{background:var(--na-card);border-radius:0 0 4px 4px}
.tk-input{background:var(--na-panel)}
.tk-input textarea{background:var(--na-card);border-radius:3px}
.diff{background:var(--na-sunken);border-radius:3px;border:1px solid var(--na-border)}

/* dialogs */
.overlay,.palette-overlay{background:rgba(11,43,42,.44)}
.modal,.palette{background:var(--na-raised);border:1px solid var(--na-border-strong);border-radius:6px;box-shadow:var(--na-shadow-modal)}
.modal-h h3{font-family:var(--na-font-display);font-size:18px}
.toast{background:var(--na-raised);border:1px solid var(--na-border-strong);border-radius:3px;color:var(--na-text)}
.drawer .modal{border-radius:0}
.bottom-nav{background:var(--na-panel);border-top:1px solid var(--na-border);backdrop-filter:none}
.bottom-nav a[aria-current="page"]{color:var(--na-brand-600)}

/* responsive */
@media (max-width:1199px){
  :root{--pad:24px}
  .deck-word .tag{display:none}
  .top-search{min-width:160px;max-width:260px}
  .nav-item{padding:0 9px;font-size:11.5px}
  .ledger-spread{grid-template-columns:1.45fr 1fr}
  .ledger-lower{grid-template-columns:1fr}
  .ledger-row2{grid-template-columns:1.5fr 1fr}
  .ledger-title{font-size:30px}
}
@media (max-width:767px){
  :root{--pad:16px;--ribbon:0px;--deck:52px}
  .ribbon{display:none}
  .shell{grid-template-rows:52px minmax(0,1fr)}
  .deck-top{height:52px;padding:0 12px;gap:8px}
  .deck-brand .ark{width:26px;height:26px}
  .deck-word .wordmark{font-size:17px}
  .menu-btn{display:grid}
  .top-search{width:32px;min-width:0;flex:none;padding:0;justify-content:center;border-color:transparent;background:transparent;margin-left:auto}
  .top-search span,.top-search .kbd{display:none}
  .top-search svg{width:18px;height:18px}
  .deck-spacer{display:none}
  .live-chip{padding:2px 6px;font-size:9px}
  .user-btn{padding:0;border:0;background:transparent}
  .user-btn .u-meta{display:none}
  .deck-top .btn.primary span:last-child{display:none}
  .deck-top .btn.primary{width:30px;padding:0;justify-content:center}
  .deck-nav{
    position:fixed;inset:28px 0 0 0;height:auto;display:none;flex-direction:column;
    background:var(--na-panel);border-bottom:1px solid var(--na-border);padding:8px 0 20px;
    overflow-y:auto;z-index:300;box-shadow:var(--na-shadow-modal);
  }
  .drawer-open .deck-nav{display:flex}
  .drawer-open .overlay-mobile{display:block;position:fixed;inset:28px 0 0 0;background:rgba(11,43,42,.42);z-index:290}
  .nav-item{height:46px;justify-content:flex-start;padding:0 18px;font-size:13px;border-bottom:1px solid var(--na-border-hairline)}
  .nav-item[aria-current="page"]{background:var(--na-brand-soft);border-bottom-color:transparent}
  .nav-item .ni{font-size:9px;width:22px}
  .main{padding:16px 16px 84px}
  .page-head h1{font-size:22px}
  .task-head h1{font-size:20px}
  .ledger-spread{grid-template-columns:1fr;min-height:0}
  .decision-margin{order:-1;border-left:0;border-bottom:1px solid var(--na-border);padding:16px}
  .ledger-main{padding:18px 16px 16px}
  .ledger-title{font-size:23px}
  .ledger-stats{grid-template-columns:1fr 1fr;gap:12px 0}
  .lstat{padding:0 10px}
  .lstat:nth-child(odd){border-left:0;padding-left:0}
  .lstat:nth-child(3),.lstat:nth-child(4){border-top:1px solid var(--na-border-hairline);padding-top:10px}
  .ledger-lower{grid-template-columns:1fr;gap:16px}
  .ledger-row2{grid-template-columns:1fr}
  .card{border-radius:4px;padding:15px}
  table.data tr{background:var(--na-card);border:1px solid var(--na-border);border-radius:4px}
  .context-strip{margin:0 0 10px}
  .bottom-nav{display:flex;background:var(--na-panel)}
  .takeover-mode .shell{grid-template-rows:1fr}
  .takeover-mode .ribbon,.takeover-mode .deck,.takeover-mode .bottom-nav{display:none}
}
@media (max-width:420px){
  .deck-word .wordmark{font-size:15px}
  .live-chip{display:none}
  .ledger-title{font-size:21px}
}

function modelBadge(m, cls){
  if(!m) return '<span class="model-badge">—</span>';
