[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "noahsark-node-agent"
version = "0.1.0"
description = "NoahsArk Windows Node Agent development simulator (outbound-only, facts-only)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
windows = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
noahsark-node = "noahsark_node.__main__:main"

[tool.setuptools.packages.find]
include = ["noahsark_node*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = false
