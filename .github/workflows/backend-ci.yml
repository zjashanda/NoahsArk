name: backend-ci
on:
  push:
    paths: ["apps/control_plane/**", ".github/workflows/backend-ci.yml", "scripts/secret-scan.sh"]
  pull_request:
    paths: ["apps/control_plane/**", ".github/workflows/backend-ci.yml", "scripts/secret-scan.sh"]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noahsark
          POSTGRES_PASSWORD: noahsark_ci
          POSTGRES_DB: noahsark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noahsark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://noahsark:noahsark_ci@127.0.0.1:5432/noahsark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/control_plane
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev]'
      - name: Migrate and seed
        working-directory: apps/control_plane
        run: |
          alembic upgrade head
          python -m noahsark.seed
      - name: Lint
        working-directory: apps/control_plane
        run: ruff check noahsark tests
      - name: Typecheck
        working-directory: apps/control_plane
        run: mypy noahsark
      - name: Tests
        working-directory: apps/control_plane
        run: pytest --disable-warnings -q
      - name: Secret scan
        run: ./scripts/secret-scan.sh
