<text x="64" y="1450" class="legend">图例：蓝=控制/查询；绿=执行/完成；橙=门禁/修复/人工；紫=知识/验证/会话；红=阻断/停止/失败；虚线=回环或异步回流。</text>
<text x="64" y="1472" class="legend">边界：Windows 节点只负责本地设备与 runner；Linux 只做编排、租约、证据验收和归档。M13 会话桥为 1027V1 评审建议，尚未并入 81 项计划。</text>
